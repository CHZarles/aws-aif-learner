<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题 · AWS AIF-C01</title>
<style>
:root{
  --bg:#f5f7fa;--panel:#ffffff;--panel2:#fafbfc;--border:#e4e8ee;
  --border-strong:#cdd3dc;--text:#1f2937;--muted:#6b7280;
  --accent:#3b82f6;--accent-soft:#dbeafe;--accent2:#8b5cf6;
  --shadow-sm:rgba(15,23,42,.04);--shadow-md:rgba(15,23,42,.08);
  --c-eval:#10b981;
}
[data-theme="dark"]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0f172a;--border:#334155;
  --border-strong:#475569;--text:#f1f5f9;--muted:#94a3b8;
  --accent:#60a5fa;--accent-soft:#1e3a8a;--accent2:#a78bfa;
  --shadow-sm:rgba(0,0,0,.3);--shadow-md:rgba(0,0,0,.5);
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;
     transition:background .3s,color .3s}
body.focus-mode main{justify-content:center}
body.focus-mode .q-side{width:220px}
body.focus-mode .q-main{max-width:820px;flex:1;padding:18px}
body.focus-mode .q-card{padding:20px 22px;border-radius:16px;margin-bottom:14px}
body.focus-mode .q-card .stem{font-size:16px;line-height:1.85}
body.focus-mode .q-card .opts{grid-template-columns:1fr;gap:10px}
body.focus-mode .q-card .opts .opt{padding:13px 15px;border-radius:10px;font-size:14px;line-height:1.55}
body.focus-mode .record-bar,body.focus-mode .beginner-tip{border-radius:14px}

header{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);
       display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px var(--shadow-sm)}
.brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:6px;
             background:linear-gradient(135deg,#58a6ff,#bc8cff);
             display:grid;place-items:center;font-size:14px;color:#000}
nav{margin-left:auto;display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:8px}
nav a{background:transparent;color:var(--muted);text-decoration:none;
      padding:5px 14px;border-radius:6px;font-size:13px}
nav a.active{background:var(--accent);color:#fff;font-weight:500}
nav a:hover:not(.active){color:var(--text);background:var(--border)}
.theme-toggle{margin-left:8px;background:var(--panel2);border:1px solid var(--border);
              padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text)}
.focus-toggle{background:var(--accent-soft);border:1px solid rgba(59,130,246,.25);
              color:var(--accent);padding:5px 10px;border-radius:6px;cursor:pointer;
              font-size:12px;font-weight:700}

main{height:calc(100vh - 53px);display:flex;overflow:hidden}
.q-side{width:240px;border-right:1px solid var(--border);background:var(--panel);
        overflow-y:auto;flex-shrink:0;box-shadow:2px 0 8px var(--shadow-sm)}
.q-side .search{padding:12px;border-bottom:1px solid var(--border)}
.q-side input{width:100%;background:var(--panel2);color:var(--text);
              border:1px solid var(--border);padding:6px 11px;border-radius:8px;
              font-size:12px;outline:none}
.q-side input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topic{padding:9px 14px;cursor:pointer;font-size:12px;
       border-bottom:1px solid var(--border);display:flex;
       justify-content:space-between;align-items:center;transition:.1s;
       color:var(--text);font-weight:500}
.topic:hover:not(.active){background:var(--panel2);color:var(--accent)}
.topic.active{background:var(--accent);color:#fff;font-weight:600}
.topic .n{background:var(--panel2);color:var(--muted);padding:1px 8px;border-radius:10px;
          font-size:10px;font-weight:600}
.topic.active .n{background:rgba(255,255,255,.2);color:#fff}

.q-main{flex:1;overflow-y:auto;padding:14px}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
        padding:14px 16px;margin-bottom:10px;transition:.15s;
        box-shadow:0 1px 3px var(--shadow-sm)}
.q-card:hover{border-color:var(--accent);box-shadow:0 4px 12px var(--shadow-md)}
.q-card .head{display:flex;justify-content:space-between;align-items:center;
              margin-bottom:8px;gap:10px}
.q-card .qid{background:var(--accent);color:#fff;padding:3px 10px;border-radius:5px;
             font-size:11px;font-weight:700;font-family:monospace}
.q-card .meta{color:var(--muted);font-size:11px;display:flex;gap:10px;align-items:center;
              font-weight:500}
.q-card .meta .type{background:var(--panel2);padding:2px 8px;border-radius:8px;
                    border:1px solid var(--border)}
.q-card .stem{font-size:14px;line-height:1.7;margin-bottom:10px;
              white-space:pre-wrap;color:var(--text)}
.q-card .opts{font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.q-card .opts .opt{padding:8px 12px;border-radius:6px;background:var(--panel2);
                   color:var(--text);border:1px solid var(--border);font-weight:500;
                   cursor:pointer;transition:.15s}
.q-card .opts .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.q-card .opts .opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.q-card .opts .opt.correct{background:rgba(16,185,129,.1);border-color:var(--c-eval);
                            border-left:3px solid var(--c-eval);font-weight:700}
.q-card .opts .opt.wrong{background:rgba(239,68,68,.08);border-color:#ef4444;
                          border-left:3px solid #ef4444}
.q-card .opts.answered .opt{cursor:default}
.q-card .submit-answer{background:var(--accent);color:#fff;border:none;border-radius:8px;
                       padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;
                       margin:2px 0 8px;transition:.15s}
.q-card .submit-answer:hover{transform:translateY(-1px);box-shadow:0 4px 10px var(--shadow-md)}
.result-panel{display:none;margin-top:12px;border:1px solid var(--border);
              border-radius:14px;overflow:hidden;background:var(--panel2)}
.q-card.answered .result-panel{display:block}
.result-head{padding:10px 14px;font-size:14px;font-weight:800;border-bottom:1px solid var(--border)}
.result-head.ok{background:rgba(16,185,129,.1);color:var(--c-eval)}
.result-head.no{background:rgba(239,68,68,.08);color:#ef4444}
.result-body{padding:12px 14px;display:grid;gap:10px}
.answer-line{font-size:14px;font-weight:700;color:var(--text)}
.answer-line b{color:var(--c-eval)}
.explain-line{font-size:13px;line-height:1.75;color:var(--text);padding-top:10px;
              border-top:1px dashed var(--border)}
.explain-line .label{display:block;color:var(--accent);font-size:12px;font-weight:800;margin-bottom:4px}
.q-card .hotspot-badge{background:rgba(245,158,11,.1);color:#b45309;
                       padding:8px 14px;border-radius:6px;font-size:12px;
                       font-weight:600;margin-bottom:8px;display:inline-block;
                       border:1px solid rgba(245,158,11,.3)}
.q-card .kps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;
             padding-top:10px;border-top:1px dashed var(--border);display:none}
.q-card.answered .kps{display:flex}
.q-card .kps::before{content:'相关知识图谱：';font-size:11px;color:var(--muted);
                     font-weight:700;align-self:center;margin-right:2px}
.q-card .kp{background:var(--panel2);padding:5px 10px;border-radius:8px;
            font-size:11px;color:var(--muted);cursor:pointer;
            border:1px solid var(--border);font-weight:500;transition:.15s}
.q-card .kp:hover{background:var(--accent);color:#fff;border-color:var(--accent);
                  transform:translateY(-1px)}
.q-card .kp.primary{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.load-more{text-align:center;padding:16px}
.load-more button{background:var(--panel);color:var(--text);border:1px solid var(--border);
                  padding:8px 24px;border-radius:8px;cursor:pointer;font-size:13px;
                  font-weight:500;transition:.15s;box-shadow:0 1px 3px var(--shadow-sm)}
.load-more button:hover{border-color:var(--accent);color:var(--accent);
                        transform:translateY(-1px);box-shadow:0 4px 8px var(--shadow-md)}
.beginner-tip{background:var(--accent-soft);color:var(--accent);padding:10px 14px;
              border-radius:10px;font-size:12px;font-weight:600;margin-bottom:10px;
              border:1px solid rgba(59,130,246,.2);line-height:1.6}
.record-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);
            border:1px solid var(--border);border-radius:12px;padding:10px 14px;
            margin-bottom:10px;box-shadow:0 1px 3px var(--shadow-sm);font-size:12px;color:var(--muted)}
.record-bar b{color:var(--accent)}
.record-bar button{margin-left:auto;background:var(--panel2);color:var(--text);border:1px solid var(--border);
                   border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.record-bar button:hover{border-color:var(--accent);color:var(--accent)}
.q-card.done{border-color:rgba(16,185,129,.35)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:.4}
mark{background:#fef3c7;color:#92400e;padding:0 3px;border-radius:3px;font-weight:600}

.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.loading .spin{font-size:36px;margin-bottom:16px;animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🎓</span>AWS AIF-C01 学习助手</div>
  <nav>
    <a href="learn.html">学习</a>
    <a href="quiz.html" class="active">刷题</a>
    <a href="graph.html">高级</a>
  </nav>
  <button class="theme-toggle" id="theme-toggle">🌙</button>
  <button class="focus-toggle" id="focus-toggle" title="一次只做一题">专注模式</button>
</header>
<main>
  <aside class="q-side">
    <div class="search"><input id="q-search" placeholder="🔍 搜索题干/选项/主题"></div>
    <div id="q-topics"></div>
  </aside>
  <div class="q-main" id="q-main">
    <div class="loading"><div class="spin">⏳</div><div>加载题库...</div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const escHtml = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const highlight = (text, kw) => {
  if(!kw) return escHtml(text);
  const re = new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escHtml(text).replace(re,'<mark>$1</mark>');
};

let DATA = null;
let Q_STATE = {topic:'', kw:''};
let Q_FILTERED = [];
let Q_RENDERED = 0;
const PAGE = 10;
let PAGE_SIZE = 1;
const RECORD_KEY = 'kg_quiz_records';
const FOCUS_KEY = 'kg_quiz_focus_mode';
let RECORDS = {};

async function load(){
  applyFocusMode(isFocusMode());
  try{
    const r = await fetch('quiz.json?t='+Date.now());
    DATA = await r.json();
    loadRecords();
  }catch(e){
    $('q-main').innerHTML = '<div class="empty"><div class="icon">❌</div>加载失败：'+escHtml(e.message)+'</div>';
    return;
  }
  initTopics();
  initSearch();
  applyFilter();
}

function loadRecords(){
  try{ RECORDS = JSON.parse(localStorage.getItem(RECORD_KEY)||'{}'); }
  catch(e){ RECORDS = {}; }
}

function saveRecords(){
  localStorage.setItem(RECORD_KEY, JSON.stringify(RECORDS));
}

function recordAnswer(qid, chosen, ok){
  RECORDS[qid] = {chosen:[...chosen].sort(), ok, ts:Date.now()};
  saveRecords();
  updateRecordBar();
}

function recordStats(){
  const rows = Object.values(RECORDS);
  const done = rows.length;
  const right = rows.filter(r=>r.ok).length;
  return {done, right, rate:done ? Math.round(right / done * 100) : 0};
}

function updateRecordBar(){
  const el = $('record-bar');
  if(!el) return;
  const s = recordStats();
  el.innerHTML = `已答 <b>${s.done}</b> / ${DATA.questions.length} 题 · 正确 <b>${s.right}</b> 题 · 正确率 <b>${s.rate}%</b>
    <button onclick="clearRecords()">清空记录</button>`;
}

function clearRecords(){
  if(!confirm('确定清空所有刷题记录吗？')) return;
  RECORDS = {};
  localStorage.removeItem(RECORD_KEY);
  applyFilter();
}

function kpName(id){
  const k = DATA.kps.find(x=>x.id===id);
  return k ? k.name : id;
}

function graphUrl(id){
  return `graph.html?focus=${encodeURIComponent(id)}`;
}

function initTopics(){
  const tc = {};
  DATA.questions.forEach(q => tc[q.topic] = (tc[q.topic]||0)+1);
  const sorted = Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  $('q-topics').innerHTML =
    `<div class="topic active" data-topic="">全部 <span class="n">${DATA.questions.length}</span></div>`+
    sorted.map(([t,c])=>`<div class="topic" data-topic="${escHtml(t)}">${escHtml(t)} <span class="n">${c}</span></div>`).join('');
  $('q-topics').querySelectorAll('.topic').forEach(el => el.onclick = () => {
    $('q-topics').querySelectorAll('.topic').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    Q_STATE.topic = el.dataset.topic;
    applyFilter();
  });
}

function initSearch(){
  let timer;
  $('q-search').oninput = e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      Q_STATE.kw = e.target.value.toLowerCase();
      applyFilter();
    }, 120);
  };
  $('q-search').onkeydown = e => {
    if(e.key==='Escape'){ $('q-search').value=''; Q_STATE.kw=''; applyFilter(); }
  };
}

function applyFilter(){
  const kw = Q_STATE.kw;
  Q_FILTERED = DATA.questions.filter(q=>{
    const mt = !Q_STATE.topic || q.topic === Q_STATE.topic;
    if(!mt) return false;
    if(!kw) return true;
    if(q.stem.toLowerCase().includes(kw)) return true;
    if(q.topic.toLowerCase().includes(kw)) return true;
    if(q.options.some(o=>o.text.toLowerCase().includes(kw))) return true;
    return false;
  });
  Q_RENDERED = 0;
  $('q-main').innerHTML = '';
  renderNextBatch();
}

function renderNextBatch(){
  const batch = Q_FILTERED.slice(Q_RENDERED, Q_RENDERED+PAGE_SIZE);
  const main = $('q-main');
  const focus = isFocusMode();
  if(focus && Q_RENDERED > 0){
    main.innerHTML = '';
  }
  if(Q_RENDERED===0 || focus){
    if(!Q_FILTERED.length){
      main.innerHTML = '';
      main.innerHTML += `<div class="empty">
        <div class="icon">🔍</div>
        没找到匹配 <b style="color:var(--accent)">"${escHtml(Q_STATE.kw)}"</b> 的题目<br>
        <span style="font-size:12px">试试搜索"决策树"、"Bedrock"、"RAG"等关键词</span>
      </div>`;
      return;
    }
    const badge = document.createElement('div');
    badge.style.cssText='background:var(--accent-soft);color:var(--accent);padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:10px;display:inline-block';
    badge.textContent = `匹配 ${Q_FILTERED.length} 题 · ${isFocusMode() ? '一次只显示 1 题' : '每次显示 10 题'}`;
    main.appendChild(badge);
    const recordBar = document.createElement('div');
    recordBar.className = 'record-bar';
    recordBar.id = 'record-bar';
    main.appendChild(recordBar);
    updateRecordBar();
    const tip = document.createElement('div');
    tip.className = 'beginner-tip';
    tip.textContent = '新手模式：先只看题干和选项。点击答案后，再显示解析和相关知识图谱。';
    main.appendChild(tip);
  }
  const frag = document.createDocumentFragment();
  const restoreQueue = [];
  batch.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    const isHotspot = q.type === 'hotspot';

    // 热区题：题干里有"热点区域"且无选项，把解析当作正文显示
    const cleanStem = q.stem.replace(/热点区域：.*$/s, '').replace(/正确答案：.*$/s, '').trim();
    const displayStem = isHotspot ? cleanStem : q.stem;

    let optsList = '';
    if(q.options.length){
      const multi = q.answer.length > 1;
      optsList = `<div class="opts" data-qid="${q.id}" data-multi="${multi?'1':'0'}">${q.options.map(o=>{
        return `<div class="opt" data-key="${o.key}" onclick="selectAnswer(${q.id}, '${o.key}')">${o.key}. ${escHtml(o.text)}</div>`;
      }).join('')}</div>
      ${multi ? `<button class="submit-answer" onclick="submitMultiAnswer(${q.id})">提交答案</button>` : ''}`;
    } else if(isHotspot){
      optsList = `<div class="hotspot-badge">📌 这是一道热区排序题（无选项，需要按顺序操作）</div>`;
    }

    const answerArea = `<div class="result-panel" id="result-${q.id}"></div>`;

    card.innerHTML = `
      <div class="head">
        <span class="qid">Q${q.id}</span>
        <span class="meta"><span>${escHtml(q.topic)}</span><span class="type">${isHotspot?'热区排序':q.type}</span></span>
      </div>
      <div class="stem">${highlight(displayStem, Q_STATE.kw)}</div>
      ${optsList}
      ${answerArea}
      <div class="kps">${q.kps.map((id,i)=>`<span class="kp ${i===0?'primary':''}" title="${i===0?'主考知识点，点击打开图谱':'关联知识点，点击打开图谱'}" onclick="openGraph('${id}')">${escHtml(kpName(id))}</span>`).join('')}</div>
    `;
    frag.appendChild(card);
    const rec = RECORDS[q.id];
    if(rec){
      card.classList.add('done');
      restoreQueue.push([q.id, rec.chosen]);
    }
  });
  main.appendChild(frag);
  restoreQueue.forEach(([id, chosen])=>revealAnswer(id, chosen, true));
  Q_RENDERED += batch.length;
  const old = $('load-more'); if(old) old.remove();
  if(Q_RENDERED < Q_FILTERED.length){
    const div = document.createElement('div');
    div.className = 'load-more'; div.id = 'load-more';
    div.innerHTML = `<button onclick="renderNextBatch()">${isFocusMode()?'下一题':'加载更多'}（${Q_RENDERED}/${Q_FILTERED.length}）</button>`;
    main.appendChild(div);
  }
  if(focus){
    main.scrollTo({top:0, behavior:'smooth'});
  }
}

function isFocusMode(){
  return localStorage.getItem(FOCUS_KEY) !== 'off';
}

function applyFocusMode(on){
  document.body.classList.toggle('focus-mode', on);
  PAGE_SIZE = on ? 1 : PAGE;
  $('focus-toggle').textContent = on ? '列表模式' : '专注模式';
  $('focus-toggle').title = on ? '一次显示多题' : '一次只做一题';
  localStorage.setItem(FOCUS_KEY, on ? 'on' : 'off');
}

function toggleFocusMode(){
  applyFocusMode(!document.body.classList.contains('focus-mode'));
  applyFilter();
}

function getQuestion(qid){
  return DATA.questions.find(q=>q.id===qid);
}

function selectedKeys(opts){
  return [...opts.querySelectorAll('.opt.selected')].map(o=>o.dataset.key).sort();
}

function sameKeys(a,b){
  return a.length===b.length && a.every((x,i)=>x===b[i]);
}

function revealAnswer(qid, chosen, restoring=false){
  const q = getQuestion(qid);
  if(!q) return;
  const opts = document.querySelector(`.opts[data-qid="${qid}"]`);
  const card = opts ? opts.closest('.q-card') : null;
  const result = $(`result-${qid}`);
  const correct = [...q.answer].sort();
  const ok = sameKeys([...chosen].sort(), correct);
  if(!opts) return;
  opts.classList.add('answered');
  if(card) card.classList.add('answered');
  opts.querySelectorAll('.opt').forEach(opt=>{
    const key = opt.dataset.key;
    opt.classList.toggle('correct', correct.includes(key));
    opt.classList.toggle('wrong', chosen.includes(key) && !correct.includes(key));
  });
  if(result){
    result.innerHTML = `
      <div class="result-head ${ok?'ok':'no'}">${restoring ? '上次记录：' : ''}${ok ? '答对了' : '答错了'}</div>
      <div class="result-body">
        <div class="answer-line">正确答案：<b>${correct.join(', ') || '见解析'}</b></div>
        <div class="explain-line"><span class="label">解析</span>${(q.explanation||'暂无解析').replace(/\n/g,'<br>')}</div>
      </div>`;
  }
  if(!restoring) recordAnswer(qid, chosen, ok);
  const nextBtn = $('load-more')?.querySelector('button');
  if(nextBtn && isFocusMode()) nextBtn.focus();
}

function selectAnswer(qid, key){
  const q = getQuestion(qid);
  const opts = document.querySelector(`.opts[data-qid="${qid}"]`);
  if(!q || !opts || opts.classList.contains('answered')) return;
  const opt = opts.querySelector(`.opt[data-key="${key}"]`);
  if(!opt) return;
  if(q.answer.length > 1){
    opt.classList.toggle('selected');
  } else {
    opts.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    revealAnswer(qid, [key]);
  }
}

function submitMultiAnswer(qid){
  const opts = document.querySelector(`.opts[data-qid="${qid}"]`);
  if(!opts || opts.classList.contains('answered')) return;
  const chosen = selectedKeys(opts);
  if(!chosen.length){
    const result = $(`result-${qid}`);
    if(result){
      result.style.display = 'block';
      result.innerHTML = `<div class="result-head no">先选择至少一个答案</div>`;
    }
    return;
  }
  revealAnswer(qid, chosen);
}

function openGraph(id){
  window.location.href = graphUrl(id);
}

// 主题
const THEME_KEY='kg_theme';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('theme-toggle').textContent = t==='dark'?'☀️':'🌙';
  localStorage.setItem(THEME_KEY,t);
}
$('theme-toggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
applyTheme(localStorage.getItem(THEME_KEY)||'light');
$('focus-toggle').onclick=toggleFocusMode;

load();
</script>
