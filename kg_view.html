<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AIF-C01 知识图谱</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.2/cose-base.js"></script>
<script src="https://unpkg.com/fcose@2.2.0/fcose.js"></script>
<style>
:root{
  /* 浅色主题 - 整体统一色调 */
  --bg:#f5f7fa;
  --panel:#ffffff;
  --panel2:#fafbfc;
  --border:#e4e8ee;
  --border-strong:#cdd3dc;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#3b82f6;
  --accent-soft:#dbeafe;
  --accent2:#8b5cf6;
  --graph-bg:#eef2f7;
  --graph-bg-grad-start:#f5f7fa;
  --graph-bg-grad-end:#e4e8ee;
  --shadow-sm:rgba(15,23,42,.04);
  --shadow-md:rgba(15,23,42,.08);
  --shadow-lg:rgba(15,23,42,.12);
  --node-text:#1f2937;
  --node-border:#ffffff;
  --c-ai:#3b82f6;--c-eval:#10b981;--c-gen:#f59e0b;--c-app:#f97316;
  --c-pe:#a855f7;--c-rag:#ef4444;--c-bed:#06b6d4;--c-sm:#22c55e;
  --c-q:#0ea5e9;--c-sec:#f43f5e;--c-resp:#c084fc;
}
[data-theme="dark"]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0f172a;--border:#334155;
  --border-strong:#475569;
  --text:#f1f5f9;--muted:#94a3b8;--accent:#60a5fa;--accent-soft:#1e3a8a;
  --accent2:#a78bfa;
  --graph-bg:#0a1224;
  --graph-bg-grad-start:#0f172a;
  --graph-bg-grad-end:#070d1a;
  --shadow-sm:rgba(0,0,0,.3);
  --shadow-md:rgba(0,0,0,.5);
  --shadow-lg:rgba(0,0,0,.6);
  --node-text:#f1f5f9;
  --node-border:#0f172a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;
     transition:background .3s, color .3s}

/* === Header 顶部仪表盘 === */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;
       background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;
       box-shadow:0 1px 3px var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--text)}
.brand .logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#58a6ff,#bc8cff);
            display:grid;place-items:center;font-size:14px;color:#000}
.stats{display:flex;gap:6px;margin-left:8px}
.stat{background:var(--panel2);padding:3px 9px;border-radius:10px;font-size:11px;
      color:var(--muted);border:1px solid var(--border);cursor:default}
.stat b{color:var(--text);font-size:12px;margin-right:3px}
nav{margin-left:auto;display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:8px}
nav button{background:transparent;color:var(--muted);border:none;padding:5px 14px;
           border-radius:6px;cursor:pointer;font-size:13px;transition:.15s}
nav button.active{background:var(--accent);color:#fff;font-weight:500}
nav button:hover:not(.active){color:var(--text);background:var(--border)}
.theme-toggle{margin-left:8px;background:var(--panel2);border:1px solid var(--border);
              padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text)}

/* === Tab 容器 === */
main{height:calc(100vh - 53px)}
.tab{display:none;width:100%;height:100%}
.tab.active{display:flex}

/* === 学习路径视图 === */
#learn-view{flex-direction:column;background:var(--bg);
             overflow-y:auto;padding:30px 20px}
.learn-wrap{max-width:760px;margin:0 auto;width:100%}
.learn-progress{margin-bottom:24px}
.progress-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;
              border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
               transition:width .4s;border-radius:3px}
.progress-text{display:flex;justify-content:space-between;font-size:12px;
               color:var(--muted);margin-top:8px;font-weight:500}
.progress-text b{color:var(--accent)}

.learn-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;
            padding:32px 36px;box-shadow:0 4px 24px var(--shadow-md);
            position:relative;overflow:hidden}
.learn-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
                    background:linear-gradient(90deg,var(--accent),var(--accent2))}
.learn-card .step-badge{display:inline-block;background:var(--accent);color:#fff;
                        padding:4px 12px;border-radius:20px;font-size:12px;
                        font-weight:600;margin-bottom:14px}
.learn-card h2{margin:0 0 4px;font-size:28px;font-weight:800;color:var(--text);
               line-height:1.2}
.learn-card .kp-id{display:inline-block;background:var(--panel2);color:var(--muted);
                  padding:2px 8px;border-radius:6px;font-size:11px;font-family:monospace;
                  margin-left:6px}
.learn-card .def{font-size:16px;line-height:1.7;color:var(--text);
                 padding:16px 20px;background:var(--accent-soft);
                 border-left:4px solid var(--accent);border-radius:0 8px 8px 0;
                 margin:20px 0}
.learn-card h3{font-size:13px;color:var(--muted);margin:24px 0 12px;
               text-transform:uppercase;letter-spacing:1px;font-weight:700;
               display:flex;align-items:center;gap:8px}
.learn-card h3::before{content:'';width:3px;height:14px;background:var(--accent);
                       border-radius:2px}
.learn-card .points{padding-left:0;list-style:none;margin:0}
.learn-card .points li{padding:10px 0 10px 28px;position:relative;font-size:14px;
                       line-height:1.6;color:var(--text);
                       border-bottom:1px dashed var(--border)}
.learn-card .points li:last-child{border-bottom:none}
.learn-card .points li::before{content:'✓';position:absolute;left:0;top:8px;
                               width:20px;height:20px;background:var(--c-eval);
                               color:#fff;border-radius:50%;font-size:12px;font-weight:700;
                               display:grid;place-items:center}
.learn-card .tip{background:var(--panel2);border:1px solid var(--border);
                 border-radius:10px;padding:14px 18px;font-size:13px;
                 color:var(--muted);line-height:1.6;margin-top:14px}
.learn-card .tip b{color:var(--accent2)}

.learn-card .q-mini-list{display:flex;flex-direction:column;gap:8px}
.learn-card .q-mini-item{background:var(--panel2);border:1px solid var(--border);
                          border-radius:8px;padding:12px 16px;cursor:pointer;
                          transition:.15s}
.learn-card .q-mini-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.learn-card .q-mini-item.open{border-color:var(--accent);background:var(--accent-soft)}
.learn-card .q-mini-item .q-head{display:flex;align-items:center;gap:8px;
                                  font-size:12px;color:var(--muted);margin-bottom:6px}
.learn-card .q-mini-item .q-head .qid{background:var(--accent);color:#fff;
                                       padding:1px 7px;border-radius:4px;
                                       font-size:10px;font-weight:700;font-family:monospace}
.learn-card .q-mini-item .q-head .hint{margin-left:auto;font-size:11px;color:var(--accent);
                                      font-weight:600}
.learn-card .q-mini-item .stem{font-size:13px;line-height:1.55;color:var(--text);
                                display:-webkit-box;-webkit-line-clamp:2;
                                -webkit-box-orient:vertical;overflow:hidden}
.learn-card .q-mini-item .ans{font-size:12px;color:var(--c-eval);margin-top:6px;
                               font-weight:600;display:none;line-height:1.6;
                               padding-top:8px;border-top:1px dashed var(--border)}
.learn-card .q-mini-item.open .ans{display:block}

.learn-nav{display:flex;gap:12px;margin-top:28px;align-items:center}
.learn-nav button{flex:1;padding:12px 16px;border-radius:10px;font-size:14px;
                  font-weight:600;cursor:pointer;transition:.15s;border:none}
.learn-nav .prev{background:var(--panel2);color:var(--text);
                 border:1px solid var(--border)}
.learn-nav .next{background:var(--accent);color:#fff}
.learn-nav .prev:hover:not(:disabled){background:var(--accent-soft);
                                       color:var(--accent);border-color:var(--accent)}
.learn-nav .next:hover:not(:disabled){transform:translateY(-1px);
                                       box-shadow:0 4px 12px var(--shadow-md)}
.learn-nav button:disabled{opacity:.4;cursor:not-allowed}

.learn-final{text-align:center;padding:60px 20px}
.learn-final .icon{font-size:64px;margin-bottom:16px}
.learn-final h2{font-size:28px;margin-bottom:12px}
.learn-final p{color:var(--muted);margin-bottom:24px}

.adv-tab{background:transparent;color:var(--muted);border:1px solid var(--border);
         padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;
         font-weight:500}
.adv-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.adv-tab:hover:not(.active){color:var(--text);background:var(--panel2)}

/* === 图谱视图 === */
#graph-view{position:relative}
#cy{flex:1;
    background:linear-gradient(135deg,var(--graph-bg-grad-start) 0%,var(--graph-bg-grad-end) 100%);
    cursor:grab}
#cy:active{cursor:grabbing}
#side{width:320px;border-left:1px solid var(--border);background:var(--panel);
      overflow-y:auto;flex-shrink:0;box-shadow:-4px 0 16px var(--shadow-sm)}
.side-empty{padding:60px 24px;text-align:center;color:var(--muted);
              font-size:13px;line-height:1.8}
.side-empty .icon{font-size:42px;margin-bottom:14px;opacity:.4;
                  filter:grayscale(0.3)}
.side-content{padding:18px}
.side-content h3{margin:0 0 8px;font-size:17px;font-weight:700;line-height:1.3;
                color:var(--text)}
.side-content .id{color:var(--muted);font-size:11px;font-weight:500;margin-left:8px;
                  font-family:monospace;background:var(--panel2);padding:1px 6px;
                  border-radius:4px}
.side-content .cat{font-size:11px;margin-bottom:12px;display:inline-block;
                   padding:3px 10px;border-radius:12px;background:var(--accent-soft);
                   color:var(--accent);font-weight:600;border:1px solid transparent}
.side-content .def{font-size:13px;line-height:1.7;color:var(--text);margin:14px 0;
                   padding:12px 14px;background:var(--panel2);
                   border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.side-content .alias-row{margin:10px 0 4px}
.side-content .alias{display:inline-block;background:var(--panel2);padding:3px 9px;
                     border-radius:6px;margin:2px 4px 2px 0;font-size:11px;
                     color:var(--muted);border:1px solid var(--border);
                     transition:.1s}
.side-content .alias:hover{background:var(--accent-soft);color:var(--accent);
                           border-color:var(--accent)}
.side-content .section-title{font-size:11px;color:var(--muted);
                            text-transform:uppercase;
                            letter-spacing:1px;margin:18px 0 10px;font-weight:700;
                            display:flex;align-items:center;gap:6px}
.side-content .section-title::before{content:'';width:3px;height:12px;
                                      background:var(--accent);border-radius:2px}
.side-content .triple{padding:8px 12px;background:var(--panel2);border-radius:8px;
                      margin-bottom:6px;font-size:12px;cursor:pointer;
                      border:1px solid var(--border);border-left:3px solid var(--accent2);
                      transition:.15s;line-height:1.5}
.side-content .triple:hover{background:var(--accent-soft);border-color:var(--accent);
                            transform:translateX(2px);
                            box-shadow:0 2px 6px var(--shadow-sm)}
.side-content .triple .pred{font-weight:700;color:var(--accent2);margin:0 4px;
                            background:rgba(139,92,246,.1);padding:1px 6px;
                            border-radius:3px}
.side-content .triple .arr{color:var(--muted);margin:0 2px;font-weight:600}

.focus-bar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);
           border:1px solid var(--accent);border-radius:8px;padding:8px 12px;
           margin:12px 0;font-size:12px;color:var(--accent);font-weight:600}
.focus-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
                animation:pulse 1.5s infinite;box-shadow:0 0 0 4px rgba(59,130,246,.2)}
.focus-bar b{color:var(--accent);font-weight:700}
.focus-bar button{margin-left:auto;background:var(--panel);border:1px solid var(--accent);
                 border-radius:6px;width:24px;height:24px;cursor:pointer;color:var(--accent);
                 font-size:13px;font-weight:700;display:grid;place-items:center;
                 transition:.15s}
.focus-bar button:hover{background:var(--accent);color:#fff}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}

.q-related{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;
            padding-right:4px}
.q-related::-webkit-scrollbar{width:5px}
.q-mini{display:flex;gap:10px;padding:8px 10px;background:var(--panel2);
        border-radius:8px;cursor:pointer;border:1px solid var(--border);
        transition:.15s;font-size:12px;align-items:flex-start}
.q-mini:hover{border-color:var(--accent);background:var(--accent-soft);
              transform:translateX(2px);box-shadow:0 2px 8px var(--shadow-sm)}
.q-mini-id{background:var(--accent);color:#fff;padding:2px 7px;border-radius:4px;
           font-size:10px;font-weight:700;flex-shrink:0;font-family:monospace;
           letter-spacing:.5px}
.q-mini-text{flex:1;color:var(--muted);line-height:1.45;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.back-btn{background:var(--panel2);border:1px solid var(--border);padding:5px 12px;
          border-radius:6px;cursor:pointer;color:var(--muted);font-size:11px;
          margin-bottom:10px;font-weight:500;transition:.15s}
.back-btn:hover{background:var(--accent-soft);color:var(--accent);
                border-color:var(--accent)}
.side-content .qid{background:var(--accent);color:#fff;padding:3px 11px;border-radius:5px;
                  font-size:12px;font-weight:700;font-family:monospace}
.opts-list{display:flex;flex-direction:column;gap:5px}
.opt-row{padding:8px 12px;background:var(--panel2);border-radius:6px;font-size:12px;
         border-left:3px solid var(--border);color:var(--text);line-height:1.5}
.opt-row.correct{background:rgba(16,185,129,.08);border-left-color:var(--c-eval);
                 color:var(--text)}
.side-content .kps{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.side-content .kp{background:var(--panel2);padding:4px 10px;border-radius:6px;
                  font-size:11px;cursor:pointer;color:var(--text);
                  border:1px solid var(--border);transition:.15s;font-weight:500}
.side-content .kp:hover{background:var(--accent);color:#fff;border-color:var(--accent);
                        transform:translateY(-1px)}

.search-results{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 220px);
                overflow-y:auto;padding-right:4px}
.q-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
              align-items:center;justify-content:center;z-index:1000;padding:18px}
.q-modal-mask.open{display:flex}
.q-modal{background:var(--panel);border-radius:16px;max-width:640px;width:100%;
         max-height:88vh;overflow-y:auto;box-shadow:0 18px 48px rgba(0,0,0,.25);
         border:1px solid var(--border)}
.q-modal-head{display:flex;justify-content:space-between;align-items:center;
               padding:14px 18px;border-bottom:1px solid var(--border);
               position:sticky;top:0;background:var(--panel);z-index:1}
.q-modal-head .qid{background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px;
                   font-size:12px;font-weight:700;font-family:monospace}
.q-modal-close{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
                width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--muted)}
.q-modal-close:hover{color:var(--text);border-color:var(--accent)}
.q-modal-body{padding:16px 18px;display:grid;gap:12px}
.q-modal-body .stem{font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--text)}
.q-modal-body .opts{display:grid;gap:8px}
.q-modal-body .opts .opt{padding:10px 12px;border-radius:8px;background:var(--panel2);
                         border:1px solid var(--border);font-size:13px;line-height:1.55}
.q-modal-body .opts .opt.correct{background:rgba(16,185,129,.1);border-color:var(--c-eval);
                                 border-left:3px solid var(--c-eval);font-weight:600}
.q-modal-body .ans-key{background:rgba(16,185,129,.1);color:var(--c-eval);
                       border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.q-modal-body .explain{font-size:13px;line-height:1.7;color:var(--text);background:var(--panel2);
                       border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0}
.q-modal-body .explain::before{content:'💡 解析：';font-weight:700;color:var(--accent);
                                display:block;margin-bottom:4px;font-size:12px}
.q-modal-body .kps-list{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;
                        border-top:1px dashed var(--border)}
.q-modal-body .kps-list .kp{background:var(--panel2);border:1px solid var(--border);
                           padding:4px 10px;border-radius:8px;font-size:11px;color:var(--muted);
                           cursor:pointer}
.q-modal-body .kps-list .kp:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-modal-body .kps-list .kp.primary{background:var(--accent-soft);color:var(--accent);
                                   border-color:var(--accent)}
                overflow-y:auto;padding-right:4px}
.search-item{display:flex;gap:10px;padding:10px 12px;background:var(--panel2);
            border-radius:8px;cursor:pointer;border:1px solid var(--border);
            transition:.15s;align-items:flex-start}
.search-item:hover{border-color:var(--accent);background:var(--accent-soft);
                  transform:translateX(2px);box-shadow:0 2px 8px var(--shadow-sm)}
.search-item .cat-tag{font-size:10px;padding:2px 7px;border-radius:6px;
                      font-weight:600;flex-shrink:0;white-space:nowrap}
.search-item .s-info{flex:1;min-width:0}
.search-item .s-name{font-size:13px;font-weight:700;color:var(--text);
                    margin-bottom:3px;line-height:1.3}
.search-item .s-def{font-size:11px;color:var(--muted);line-height:1.45;
                    display:-webkit-box;-webkit-line-clamp:2;
                    -webkit-box-orient:vertical;overflow:hidden}

.toolbar{position:absolute;top:14px;left:14px;z-index:10;
         background:var(--panel);padding:8px 12px;border-radius:12px;
         border:1px solid var(--border);
         box-shadow:0 2px 12px var(--shadow-md),0 0 0 1px var(--shadow-sm);
         display:flex;gap:6px;flex-wrap:wrap;max-width:680px;align-items:center;
         backdrop-filter:blur(12px)}
.toolbar input,.toolbar select{background:var(--panel2);color:var(--text);
        border:1px solid var(--border);padding:6px 11px;border-radius:8px;
        font-size:12px;outline:none;transition:.15s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar input{width:180px}
.toolbar .sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.toolbar button{background:var(--accent);color:#fff;border:none;padding:6px 12px;
                border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;
                transition:.15s}
.toolbar button:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow-md)}
.toolbar button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.toolbar button.ghost:hover{background:var(--accent-soft);color:var(--accent);
                            border-color:var(--accent);transform:translateY(-1px)}
.toolbar .count{color:var(--muted);font-size:11px;padding:0 6px;font-weight:500}
.graph-help{position:absolute;right:344px;bottom:14px;z-index:10;
            background:var(--panel);border:1px solid var(--border);border-radius:12px;
            padding:10px 12px;box-shadow:0 2px 12px var(--shadow-md);
            color:var(--muted);font-size:11px;line-height:1.7;max-width:260px}
.graph-help b{color:var(--text)}
.graph-help kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
                background:var(--panel2);border:1px solid var(--border);border-bottom-color:var(--border-strong);
                border-radius:4px;padding:1px 5px;color:var(--text);margin:0 2px}

.legend{position:absolute;bottom:14px;left:14px;background:var(--panel);
        padding:12px 14px;border-radius:12px;border:1px solid var(--border);
        box-shadow:0 2px 12px var(--shadow-md);
        font-size:11px;max-width:240px}
.legend .title{font-weight:600;margin-bottom:8px;font-size:10px;color:var(--muted);
               text-transform:uppercase;letter-spacing:.8px}
.legend .item{display:flex;align-items:center;gap:8px;padding:3px 6px;cursor:pointer;
             border-radius:6px;transition:.1s}
.legend .item:hover{background:var(--accent-soft)}
.legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;
             box-shadow:0 0 0 2px var(--panel)}

const $ = id => document.getElementById(id);
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}};
const kpName = id => (DATA.kps.find(k=>k.id===id)||{}).name || id;
const nameToId = name => {const k=DATA.kps.find(x=>x.name===name);return k?k.id:null;};
const escHtml = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function getStepPracticeQuestions(step){
  if(!DATA || !DATA.questions || !step) return [];
  const ids = new Set(step.kpIds);
  return DATA.questions
    .filter(q => ids.has(q.kps[0]))
    .slice(0, 2);
}

function togglePracticeQuestion(el){
  el.classList.toggle('open');
  const hint = el.querySelector('.hint');
  if(hint) hint.textContent = el.classList.contains('open') ? '收起答案' : '点我看答案';
}

function renderLearnStep(){
  const wrap = $('learn-view');
  if(!wrap) return;

  if(!DATA || !DATA.kps){
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">⏳ 加载中...</div>';
    return;
  }

  if(LEARN_STEP >= LEARN_PATH.length){
    wrap.innerHTML = `
      <div class="learn-wrap">
        <div class="learn-final">
          <div class="icon">🎉</div>
          <h2>恭喜！学习路径走完啦</h2>
          <p>你已经走完整条核心学习路径。<br>现在去「刷题」检验成果，或在「高级」中探索完整图谱。</p>
          <div style="display:flex;gap:12px;justify-content:center">
            <button class="adv-tab active" onclick="switchTab('q')" style="background:var(--accent);color:#fff;border-color:var(--accent)">📝 开始刷题</button>
            <button class="adv-tab" onclick="resetLearn()" style="background:var(--panel2);color:var(--text)">🔄 重新学习</button>

        </div>
      </div>`;

  }
  const step = LEARN_PATH[LEARN_STEP];

  const practiceQs = getStepPracticeQuestions(step);

  wrap.innerHTML = `
    <div class="learn-wrap">
      <div class="learn-progress">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">
          <span>第 <b>${LEARN_STEP+1}</b> / ${total} 步</span>
          <span>配套例题 <b>${practiceQs.length}</b> 道</span>
        </div>
      </div>

      <div class="learn-card">
        <div class="step-badge">Step ${LEARN_STEP+1}</div>
        <h2>${escHtml(step.title)}
          ${step.kpIds.map(id=>`<span class="kp-id">${id}</span>`).join('')}
        </h2>
        <div class="def">${step.kpIds.map(id=>{
          const k = DATA.kps.find(x=>x.id===id);
          return k ? escHtml(k.definition) : '';
        }).filter(Boolean).join('<br>')}</div>

        <h3>核心要点</h3>
        <ul class="points">
          ${step.points.map(p=>`<li>${escHtml(p)}</li>`).join('')}
        </ul>

        ${step.tip ? `<div class="tip">${step.tip}</div>` : ''}

        <h3>互动例题</h3>
        <div class="q-mini-list">
          ${practiceQs.length ? practiceQs.map(q=>`
            <div class="q-mini-item" onclick="togglePracticeQuestion(this)">
              <div class="q-head">
                <span class="qid">Q${q.id}</span>
                <span>${escHtml(q.topic)} · ${escHtml(q.type)}</span>
                <span class="hint">点我看答案</span>
              </div>
              <div class="stem">${escHtml(q.stem_short || q.stem)}</div>
              <div class="ans">
                答案：${q.answer.length ? `<b>${escHtml(q.answer.join(', '))}</b>` : '<b>见解析</b>'}
                ${q.explanation ? `<br>${escHtml(q.explanation)}` : ''}
              </div>
            </div>
          `).join('') : '<div class="tip">这一节暂无强关联例题，先理解概念即可。</div>'}
        </div>

        <div class="learn-nav">
          <button class="prev" onclick="prevStep()" ${LEARN_STEP===0?'disabled':''}>← 上一步</button>
          <button class="next" onclick="nextStep()">

          </button>
        </div>
      </div>
    </div>
  `;
}

function nextStep(){
  if(LEARN_STEP < LEARN_PATH.length-1){
    LEARN_STEP++;
  } else {
    LEARN_STEP = LEARN_PATH.length;
  }
  localStorage.setItem('kg_learn_step', LEARN_STEP);
  renderLearnStep();
  $('learn-view').scrollTop = 0;
}

function prevStep(){
  if(LEARN_STEP > 0){
    LEARN_STEP--;
    localStorage.setItem('kg_learn_step', LEARN_STEP);
    renderLearnStep();
    $('learn-view').scrollTop = 0;
  }
}

function resetLearn(){
  if(confirm('确定要重新开始学习吗？')){
    LEARN_STEP = 0;
    localStorage.removeItem('kg_learn_step');
    renderLearnStep();
  }
}
const highlight = (text,kw) => {
  if(!kw)return escHtml(text);
  const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escHtml(text).replace(re,'<mark>$1</mark>');
};

async function loadData(){
  const t0=performance.now();
  // cache-busting：确保每次拉到最新数据
  const r=await fetch('kg_data.json?t='+Date.now());
  DATA=await r.json();

  // 默认从第 1 步开始
  const savedStep = parseInt(localStorage.getItem('kg_learn_step')||'0');
  LEARN_STEP = isNaN(savedStep) ? 0 : Math.min(savedStep, LEARN_PATH.length);
  const dt=performance.now()-t0;
  $('perf').textContent=`数据 ${(dt).toFixed(0)}ms · ${DATA.meta.kp_count}节点 · ${DATA.meta.triple_count}边`;
  if($('nav-kp')) $('nav-kp').textContent=DATA.meta.kp_count;
  if($('nav-q')) $('nav-q').textContent=DATA.meta.question_count;

  // Header stats
  const cats={};
  DATA.kps.forEach(k=>cats[k.category]=(cats[k.category]||0)+1);
  $('stats').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1])
    .map(([c,n])=>`<span class="stat" data-cat="${c}" title="${c}"><b>${n}</b>${c}</span>`).join('');

  // 每个 init 单独 try/catch，单个失败不影响其他
  try{ initGraph(); }catch(e){ console.error('initGraph failed:', e); }
  try{ initList(); }catch(e){ console.error('initList failed:', e); }
  try{ initQuestions(); }catch(e){ console.error('initQuestions failed:', e); }
  try{ initLegend(); }catch(e){ console.error('initLegend failed:', e); }
  // 学习路径渲染：即使上面失败也要保证执行
  try{ renderLearnStep(); }catch(e){
    console.error('renderLearnStep failed:', e);
    $('learn-view').innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">学习内容加载失败，请刷新重试</div>';
  }
}

function renderTierLabels(){

  // 移除旧标签
  cy.parentElement.querySelectorAll('.tier-label, .tier-band').forEach(el => el.remove());
  // 用 viewport 坐标定位
  TIERS.forEach((t, i) => {
    // 在 cytoscape 容器内绝对定位
    // 计算cytoscape内部的 y 坐标 → DOM 坐标
    const screenPos = CY.renderToScreen({x: 0, y: t.y});
    const containerRect = cy.getBoundingClientRect();
    const scale = CY.zoom();
    const pan = CY.pan();
    // y 在 cytoscape 视口里的位置
    const domY = (t.y * scale) + pan.y + containerRect.height/2 - (CY.extent().y * scale + pan.y);
    // 简化：直接用百分比定位
    const cyHeight = parseFloat(getComputedStyle(cy).height);
    // 估算 tier 在总图谱中的位置

    `;
    label.innerHTML = `${t.label}<br><span style="font-size:9px;font-weight:400;opacity:.85">${t.desc}</span>`;
    cy.parentElement.appendChild(label);
  });
}

function initGraph(){
  const t0=performance.now();
  const nodes=DATA.kps.map(k=>({
    data:{id:k.id,name:k.name,category:k.category,definition:k.definition,aliases:k.aliases},
    classes:k.category
  }));
  const edges=DATA.triples.map((t,i)=>({
    data:{id:'e'+i,source:nameToId(t.subject),target:nameToId(t.object),
          predicate:t.predicate,type:t.type},
    classes:t.type
  })).filter(e=>e.data.source&&e.data.target);

  // 计算每个节点的度数（连接数）→ 决定节点大小
const nodeDegree = {};
DATA.kps.forEach(k => nodeDegree[k.id] = 0);
DATA.triples.forEach(t => {
  const s = nameToId(t.subject), o = nameToId(t.object);
  if(s) nodeDegree[s] = (nodeDegree[s]||0) + 1;
  if(o) nodeDegree[o] = (nodeDegree[o]||0) + 1;
});

CY=cytoscape({
    container:$('cy'),
    elements:[...nodes,...edges],
    style:[
      {selector:'node',style:{
        'background-color':ele=>COLORS[ele.data('category')]||'#888',
        'label':ele=>ele.data('name'),
        'color':getComputedStyle(document.body).getPropertyValue('--node-text').trim(),
        'font-size':ele=>{
          const d = nodeDegree[ele.data('id')]||0;
          if(d>=12) return '12px';
          if(d>=6)  return '11px';
          return '9px';
        },
        'font-weight':ele=>(nodeDegree[ele.data('id')]||0)>=8 ? 700 : 500,
        'text-outline-color':getComputedStyle(document.body).getPropertyValue('--node-border').trim(),
        'text-outline-width':2,'text-outline-opacity':0.8,
        'text-wrap':'wrap','text-max-width':ele=>{
          const d = nodeDegree[ele.data('id')]||0;
          return d>=8 ? '110px' : '70px';
        },
        'width':ele=>{
          const d = nodeDegree[ele.data('id')]||0;
          if(d>=15) return 56;   // 枢纽节点（LLM/生成式AI/机器学习）
          if(d>=10) return 44;   // 重要节点
          if(d>=6)  return 32;   // 中等节点
          if(d>=3)  return 24;
          return 18;              // 叶子节点
        },
        'height':ele=>{
          const d = nodeDegree[ele.data('id')]||0;
          if(d>=15) return 56;
          if(d>=10) return 44;
          if(d>=6)  return 32;
          if(d>=3)  return 24;
          return 18;
        },
        'border-color':getComputedStyle(document.body).getPropertyValue('--node-border').trim(),
        'border-width':ele=>(nodeDegree[ele.data('id')]||0)>=8 ? 3 : 2,
        'border-opacity':0.9,
        'overlay-opacity':0
      }},
      {selector:'node:selected',style:{'border-color':'#ffffff','border-width':3.5,
        'font-size':'13px','font-weight':'bold',
        'text-max-width':'130px','z-index':999}},
      {selector:'node.hub',style:{
        'border-width':3,'font-weight':700,
        'background-blacken':-0.1
      }},
      {selector:'node.highlighted',style:{
        'border-color':'#ffffff','border-width':3,'opacity':1}},
      // 边样式：按谓词类型区分
      {selector:'edge',style:{
        'curve-style':'bezier','width':ele=>{
          const p = ele.data('predicate');
          if(p==='属于'||p==='包含') return 1.5;  // 层级关系：粗实线
          if(p==='用于'||p==='解决'||p==='缓解') return 1.0;
          return 0.8;
        },'opacity':0.35,
        'line-color':ele=>PRED_COLORS[ele.data('predicate')]||'#94a3b8',
        'target-arrow-color':ele=>PRED_COLORS[ele.data('predicate')]||'#94a3b8',
        'target-arrow-shape':'triangle','arrow-scale':0.6
      }},
      // 层级关系（属于/包含）：实线 + 默认可见
      {selector:'edge[predicate="属于"], edge[predicate="包含"]',style:{
        'line-style':'solid','opacity':0.7,'width':1.8,
        'target-arrow-shape':'triangle','arrow-scale':0.8
      }},
      // 功能关系（用于/解决）：实线但更细
      {selector:'edge[predicate="用于"], edge[predicate="解决"], edge[predicate="缓解"], edge[predicate="提升"], edge[predicate="依赖"], edge[predicate="前置"]',
       style:{'line-style':'solid','opacity':0.5}},
      // 影响/单位/范围/适用：细实线
      {selector:'edge[predicate="影响"], edge[predicate="单位"], edge[predicate="范围"]',
       style:{'line-style':'solid','opacity':0.4,'width':0.8}},
      // 角色关系（保护/约束/提升/驱动/威胁）：细实线
      {selector:'edge[predicate="保护"], edge[predicate="约束"], edge[predicate="驱动"], edge[predicate="威胁"], edge[predicate="审核"], edge[predicate="增强"], edge[predicate="加密"], edge[predicate="记录"], edge[predicate="审计"], edge[predicate="隔离"], edge[predicate="输入"], edge[predicate="基于"], edge[predicate="评估"], edge[predicate="属于"]',
       style:{'line-style':'solid','opacity':0.45}},
      // 百科型关系：虚线
      {selector:'edge.T',style:{'opacity':0.6}},
      {selector:'edge.E',style:{'opacity':0.35,'line-style':'dashed'}},
      // 悬停高亮：显示谓词
      {selector:'edge.highlighted',style:{'opacity':1,'width':2.8,'z-index':999,
        'label':ele=>ele.data('predicate'),
        'color':getComputedStyle(document.body).getPropertyValue('--node-text').trim(),
        'font-size':'10px','font-weight':600,
        'text-background-color':getComputedStyle(document.body).getPropertyValue('--panel').trim(),
        'text-background-opacity':1,'text-background-padding':'3px',
        'text-border-color':getComputedStyle(document.body).getPropertyValue('--border').trim(),
        'text-border-width':1,'text-border-opacity':1,
        'line-style':'solid'}},
      {selector:'.faded',style:{'opacity':0.05,'events':'no','text-opacity':0}},
      {selector:'.faded.edge',style:{'opacity':0.05,'events':'no'}},
      // 被当前模式隐藏的边：直接不显示，让模式切换效果更明显。
      {selector:'.dim',style:{'display':'none'}},
    ],
    layout:{name:'preset'},
    wheelSensitivity:0.2, minZoom:0.15, maxZoom:3,
  });

  // 布局策略：先按类别分簇预设坐标（保证不重叠），再 fcose 局部微调
  setTimeout(()=>{
    const tl0=performance.now();

    // 新布局：按学习层级垂直分层（小白友好）
    // T1: 基础理论（机器学习/深度学习/生成式AI 等抽象根）
    // T2: 核心概念（LLM/FM/各算法）
    // T3: 技术方法（RAG/微调/提示工程/评估指标）
    // T4: AWS 服务（Bedrock/SageMaker/Amazon Q）
    // T5: 治理（安全/合规/负责任AI）

    const tierOf = (name) => {
      // 显式映射未知节点 → 默认 T3
      const t1 = new Set(['机器学习','深度学习','生成式AI','自然语言处理(NLP)','计算机视觉']);
      const t2 = new Set(['大语言模型(LLM)','基础模型(FM)','小型语言模型(SLM)','多模态模型',
                          '监督学习','无监督学习','强化学习','决策树','线性回归','逻辑回归',
                          'K近邻(KNN)','K均值聚类','朴素贝叶斯','自编码器','生成对抗网络(GAN)',
                          'Transformer架构','扩散模型','嵌入(向量表示)','提示(Prompt)',
                          '检索增强生成(RAG)','微调(Fine-tuning)','幻觉','温度参数',
                          '上下文窗口','标记(Token)']);
      const t4 = new Set(['Amazon Bedrock','Amazon SageMaker','Amazon Q Business',
                          'Amazon Q Developer','Amazon Q in QuickSight','Amazon Q Apps',
                          'Bedrock代理','Bedrock知识库','Bedrock防护栏','SageMaker Studio',
                          'SageMaker Canvas','SageMaker JumpStart','SageMaker Ground Truth',
                          'SageMaker Clarify']);
      if (t1.has(name)) return 1;
      if (t2.has(name)) return 2;
      if (t4.has(name)) return 4;
      // 主题关键词推断
      if (/评估|指标/.test(name)) return 3;
      if (/提示|CoT|少样本|零样本|思维链|ReAct|角色|对抗|越狱|注入|提取/.test(name)) return 3;
      if (/RAG|微调|预训练|检索|嵌入|向量|分块|嵌入模型|知识库|语义|指令|RLHF|LoRA|域自适应|持续/.test(name)) return 3;
      if (/生成|扩散|GAN|图像|视频|语音|TTS|ASR|翻译|摘要|情感|文本生成|异常|目标|推荐|IDP/.test(name)) return 3;
      if (/IAM|KMS|加密|合规|VPC|PrivateLink|PII|数据驻留|脱敏|生命周期|Macie|Artifact|CloudTrail|Config|审计|预算|敏感|静态|传输/.test(name)) return 5;
      if (/公平|偏见|透明|可解释|PDP|SHAP|偏差|抽样|HITL|漂移|负责任|隐私|性能/.test(name)) return 5;
      // 默认治理类
      return 5;
    };

    const tierNames = {1:'基础理论', 2:'核心概念', 3:'技术方法', 4:'AWS服务', 5:'治理与合规'};
    const tierY = {1: 100, 2: 350, 3: 600, 4: 850, 5: 1100};

    // 按 tier 分组
    const byTier = {1:[],2:[],3:[],4:[],5:[]};
    DATA.kps.forEach(k => { byTier[tierOf(k.name)].push(k); });

    const positions = {};
    const SP = 90;  // 节点间距加大
    for(const tier of [1,2,3,4,5]){
      const kps = byTier[tier];
      // 按连接数（度数）排序，让 hub 居中
      kps.sort((a,b) => (nodeDegree[b.id]||0) - (nodeDegree[a.id]||0));
      const cols = kps.length;
      const totalW = cols * SP;
      const startX = -totalW/2 + SP/2;
      kps.forEach((k, i) => {
        positions[k.id] = { x: startX + i * SP, y: tierY[tier] };
      });
    }

    // preset
    CY.nodes().forEach(n => {
      const p = positions[n.id()];
      if (p) n.position(p);
    });

    // 5) fcose 局部微调（不强求全局收敛）
    const layout = CY.layout({
      name: 'fcose',
      animate: false,
      randomize: false,
      nodeRepulsion: 8000,
      idealEdgeLength: 90,
      edgeElasticity: 0.3,
      gravity: 0.15,
      numIter: 800,
      tile: false,
      packComponents: false,
      nodeSeparation: 60,
      fit: true,
      padding: 80
    });
    layout.run();

    const dt = performance.now() - tl0;
    $('perf').textContent = `布局 ${dt.toFixed(0)}ms · ${CY.nodes().length}节点`;
    LAYOUT_CACHE = CY.nodes().map(n => ({ id: n.id(), pos: n.position() }));

    // 渲染分层背景标签
    renderTierLabels();

    CY.fit(null, 60);
  }, 50);

  CY.on('tap','node',e=>showNode(e.target));
  CY.on('dbltap','node',e=>focusNeighborhood(e.target));
  // 点击空白处不再清空聚焦（用重置按钮或聚焦栏退出）
  CY.on('mouseover','edge',e=>e.target.addClass('highlighted'));
  CY.on('mouseout','edge',e=>e.target.removeClass('highlighted'));

  // 过滤器
  const catSel=$('filter-cat');
  Object.keys(COLORS).forEach(c=>catSel.innerHTML+=`<option value="${c}">${c}</option>`);

function matchKP(k, kw){
  if(!kw) return true;
  const lk=kw.toLowerCase();
  return k.name.toLowerCase().includes(lk)
      || k.aliases.some(a=>a.toLowerCase().includes(lk))
      || k.definition.toLowerCase().includes(lk);
}

// 视图模式：按谓词类型分组
const VIEW_MODES = {
  hierarchy: ['属于', '包含'],
  functional: ['属于', '包含', '用于', '解决', '缓解', '依赖', '前置', '提升'],
  all: null  // null = 全部
};

function applyViewMode(mode){
  const preds = VIEW_MODES[mode];
  CY.batch(()=>{
    if(preds === null){
      // 全部：清除dim
      CY.edges().removeClass('dim');
    } else {
      CY.edges().forEach(e=>{
        if(preds.includes(e.data('predicate'))) e.removeClass('dim');
        else e.addClass('dim');
      });
    }
  });
  $('match-count').textContent = preds===null ? `全 ${CY.edges().length} 条边`
    : `${CY.edges().not('.dim').length}/${CY.edges().length} 边`;
}

function applyFilter(){
  const kw=$('search').value.trim();
  const cat=$('filter-cat').value;
  const pred=$('filter-pred').value;
  let matchN=0;
  const matchedNodes=[];

  CY.batch(()=>{
    // 只清faded/highlighted，保留dim（视图模式设置）
    CY.elements().removeClass('faded highlighted');

    // 1) 先决定哪些节点要保留
    const visibleNodeIds = new Set();
    CY.nodes().forEach(n=>{
      const k=n.data();
      const ok=matchKP(k, kw) && (!cat || k.category===cat);
      if(ok){ visibleNodeIds.add(n.id()); matchN++; matchedNodes.push(k); }
      else n.addClass('faded');
    });

    // 2) 处理边：两端节点都可见的边才可见；或匹配关系筛选
    CY.edges().forEach(e=>{
      const sId=e.source().id(), tId=e.target().id();
      const bothVisible = visibleNodeIds.has(sId) && visibleNodeIds.has(tId);
      if(pred){
        if(e.data('predicate')===pred){
          e.addClass('highlighted');
          e.source().removeClass('faded');
          e.target().removeClass('faded');
        } else {
          e.addClass('faded');
        }
      } else {
        if(!bothVisible) e.addClass('faded');
      }
    });
  });

  $('match-count').textContent = (kw||cat||pred) ? `匹配 ${matchN}` : '';

  if(kw && matchedNodes.length){
    showSearchResults(matchedNodes, kw);
  } else if(!kw && !CY.$('.highlighted').length){
    if(!$('side').querySelector('.focus-bar')){
      $('side').innerHTML=`<div class="side-empty">
        <div class="icon">🕸️</div>点击节点查看详情<br>双击节点聚焦其关系<br>拖拽和滚轮缩放探索图谱
      </div>`;
    }
  }
}

function showSearchResults(nodes, kw){
  // 按相关度排序：名字命中 > 别名命中 > 定义命中
  const ranked = nodes.map(k=>{
    const lk = kw.toLowerCase();
    let score = 0;
    if(k.name.toLowerCase().includes(lk)) score += 100;
    if(k.aliases.some(a=>a.toLowerCase()===lk)) score += 50;  // 别名完全匹配
    if(k.aliases.some(a=>a.toLowerCase().includes(lk))) score += 30;
    if(k.definition.toLowerCase().includes(lk)) score += 10;
    if(k.name.toLowerCase().startsWith(lk)) score += 20;  // 开头匹配加权
    return {k, score};
  }).sort((a,b)=>b.score-a.score).slice(0,30);

  $('side').innerHTML = `
    <div class="side-content">
      <h3>🔍 搜索 "${escHtml(kw)}"</h3>
      <div style="color:var(--muted);font-size:12px;margin-bottom:10px">
        找到 <b style="color:var(--accent)">${nodes.length}</b> 个知识点${nodes.length>30?'（显示前30）':''}
      </div>
      <div class="search-results">
        ${ranked.map(({k})=>`
          <div class="search-item" onclick="focusNode('${k.id}')">
            <span class="cat-tag" style="background:${COLORS[k.category]}22;color:${COLORS[k.category]}">${k.category}</span>
            <div class="s-info">
              <div class="s-name">${highlight(k.name, kw)}</div>
              <div class="s-def">${highlight(k.definition, kw)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function showNode(node){
  const k=node.data();
  CY.batch(()=>{
    CY.elements().removeClass('faded highlighted');
    const nb = node.closedNeighborhood();
    const outsideNodes = CY.nodes().difference(nb.nodes());
    const outsideEdges = CY.edges().difference(nb.edges());
    outsideNodes.addClass('faded');
    outsideEdges.addClass('faded');
    nb.nodes().addClass('highlighted');
    nb.edges().not('.dim').addClass('highlighted');
    node.removeClass('faded').addClass('highlighted');
  });

  // 2) 强关联题目：先取主考点=当前节点；不足时按 KP 任一匹配；再不足按主题/选项同词补全。
  let relatedQs = DATA.questions.filter(q => q.kps[0] === k.id);
  if(!relatedQs.length){
    relatedQs = DATA.questions
      .filter(q => q.kps && q.kps.includes(k.id))
      .map(q => ({q, pos: q.kps.indexOf(k.id)}))
      .sort((a,b)=>a.pos-b.pos || a.q.id-b.q.id)
      .slice(0, 8)
      .map(x=>x.q);
  }
  if(!relatedQs.length){
    const kw = (k.name + ' ' + (k.aliases||[]).join(' ')).toLowerCase();
    relatedQs = DATA.questions
      .filter(q => q.topic === k.category
        || (kw && (q.stem.toLowerCase().includes(kw) || q.options.some(o=>o.text.toLowerCase().includes(kw)))))
      .map(q => ({q, score: (q.topic===k.category?100:0) + (q.stem.toLowerCase().includes(k.name.toLowerCase())?20:0) + (q.options.some(o=>o.text.toLowerCase().includes(k.name.toLowerCase()))?10:0)}))
      .sort((a,b)=>b.score-a.score || a.q.id-b.q.id)
      .slice(0, 6)
      .map(x=>x.q);
  }

  // 3) 关联三元组
  const incoming=DATA.triples.filter(t=>nameToId(t.object)===k.id);
  const outgoing=DATA.triples.filter(t=>nameToId(t.subject)===k.id);
  const all=[...incoming,...outgoing];
  const nbNodeCount = node.closedNeighborhood().nodes().length - 1;

  $('side').innerHTML=`
    <div class="side-content">
      <h3>${escHtml(k.name)}<span class="id">${k.id}</span></h3>
      <span class="cat" style="color:${COLORS[k.category]};border-color:${COLORS[k.category]}33">${k.category}</span>
      <div class="def">${escHtml(k.definition)}</div>
      <div class="alias-row">${k.aliases.map(a=>`<span class="alias">${escHtml(a)}</span>`).join('')}</div>
      <div class="focus-bar">
        <span class="dot"></span>已聚焦 · <b>${nbNodeCount}</b> 个关联节点
        <button onclick="clearHighlight()" title="退出聚焦">↺</button>
      </div>
      <div class="section-title">关联 (${all.length})</div>
      ${all.map(t=>{
        const otherName=t.subject===k.name?t.object:t.subject;
        const otherId=nameToId(otherName);
        const isSubject=t.subject===k.name;
        return `<div class="triple" onclick="focusNode('${otherId}')">
          <span style="font-weight:500">${escHtml(isSubject?k.name:otherName)}</span>
          <span class="arr">${isSubject?'→':'←'}</span>
          <span class="pred">${t.predicate}</span>
          <span class="arr">${isSubject?'→':'←'}</span>
          <span style="font-weight:500">${escHtml(isSubject?otherName:k.name)}</span>
        </div>`;
      }).join('')||'<div style="color:var(--muted);font-size:12px">无关联</div>'}
      <div class="section-title">📝 主考此知识点的题目 (${relatedQs.length})</div>
      <div class="q-related" id="q-related">
        ${relatedQs.length===0 ? '<div style="color:var(--muted);font-size:12px;padding:6px 0">这道概念在题库里没有单独出题。<br>试试看它的父类或强关联知识点。</div>' :
          relatedQs.map(q=>`
            <div class="q-mini" data-qid="${q.id}" title="点击查看完整题目">
              <span class="q-mini-id">Q${q.id}</span>
              <span class="q-mini-text">${escHtml(q.stem_short)}</span>
            </div>`).join('')}
      </div>
    </div>`;
  bindQRelated();
}

// 强制去重叠：迭代推开距离过近的节点
function spreadNodes(){
  const nodes=CY.nodes();
  const MIN=55;  // 节点最小间距
  for(let iter=0;iter<8;iter++){
    let moved=false;
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const pa=a.position(),pb=b.position();
        const dx=pb.x-pa.x,dy=pb.y-pa.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<MIN && d>0.01){
          const push=(MIN-d)/2;
          const nx=dx/d*push, ny=dy/d*push;
          a.position({x:pa.x-nx,y:pa.y-ny});
          b.position({x:pb.x+nx,y:pb.y+ny});
          moved=true;
        }
      }
    }
    if(!moved)break;
  }
}

function renderKPGrid(){
  const kw=LIST_STATE.kw;
  // 一次性计算统计：每个 KP 的关联数和题目数
  const tripleCount={}, qCount={};
  DATA.triples.forEach(t=>{
    [nameToId(t.subject),nameToId(t.object)].forEach(id=>{if(id)tripleCount[id]=(tripleCount[id]||0)+1;});
  });
  DATA.questions.forEach(q=>{ if(q.kps[0]) qCount[q.kps[0]]=(qCount[q.kps[0]]||0)+1; });

  const filtered=DATA.kps.filter(k=>{
    const mc=!LIST_STATE.cat||k.category===LIST_STATE.cat;
    const mk=!kw||matchKP(k,kw);
    return mc&&mk;
  });

  const grid=$('kp-grid');
  if(!filtered.length){
    grid.innerHTML = `<div class="empty">
      <div style="font-size:36px;margin-bottom:10px;opacity:.3">🔍</div>
      没找到匹配 <b style="color:var(--accent)">"${escHtml(kw)}"</b> 的知识点<br>
      <span style="font-size:12px">试试搜索"决策树"、"RAG"、"Bedrock"等关键词</span>
    </div>`;
    return;
  }

  const frag=document.createDocumentFragment();
  filtered.forEach(k=>{
    const card=document.createElement('div');
    card.className='kp-card';
    card.onclick=()=>goToNode(k.id);
    card.innerHTML=`
      <div class="row1">
        <span class="cat" style="color:${COLORS[k.category]};background:${COLORS[k.category]}1a">${k.category}</span>
        <span class="id">${k.id}</span>
      </div>
      <div class="name">${highlight(k.name,kw)}</div>
      <div class="def">${highlight(k.definition,kw)}</div>
      <div class="row2">
        <span>🔗 ${tripleCount[k.id]||0} 关联</span>
        <span>📝 ${qCount[k.id]||0} 主考题</span>
      </div>`;
    frag.appendChild(card);
  });
  grid.innerHTML='';
  grid.appendChild(frag);

  // 显示匹配数
  const bar = document.querySelector('#adv-list .list-bar');
  let badge = bar.querySelector('.match-badge');
  if(kw || LIST_STATE.cat){
    if(!badge){
      badge = document.createElement('span');
      badge.className='match-badge';
      badge.style.cssText='background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-left:auto';
      bar.appendChild(badge);
    }
    badge.textContent = `${filtered.length} 个匹配`;
    badge.style.display='';
  } else if(badge) {
    badge.style.display='none';
  }
}

    // 等待动画完成后再 zoom in
    setTimeout(()=>{
      CY.animate({ center:{ eles:n }, zoom: 1.4 }, { duration: 350 });
    }, 50);
  });
}

/* ================= 题目 ================= */
function initQuestions(){
  const tc={};
  DATA.questions.forEach(q=>tc[q.topic]=(tc[q.topic]||0)+1);
  const sorted=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  $('q-topics').innerHTML=
    `<div class="topic active" data-topic="">全部 <span class="n">${DATA.questions.length}</span></div>`+
    sorted.map(([t,c])=>`<div class="topic" data-topic="${t}">${t} <span class="n">${c}</span></div>`).join('');
  $('q-topics').querySelectorAll('.topic').forEach(el=>el.onclick=()=>{
    $('q-topics').querySelectorAll('.topic').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');Q_STATE.topic=el.dataset.topic;applyQuestionFilter();
  });
  $('q-search').oninput=debounce(e=>{Q_STATE.kw=e.target.value.toLowerCase();applyQuestionFilter();},120);
  applyQuestionFilter();
}

function applyQuestionFilter(){
  const kw=Q_STATE.kw;
  Q_FILTERED=DATA.questions.filter(q=>{
    const mt=!Q_STATE.topic||q.topic===Q_STATE.topic;
    if(!kw) return mt;
    const lk=kw.toLowerCase();
    // 在题干、选项、主题中搜索
    if(q.stem.toLowerCase().includes(lk)) return mt;
    if(q.topic.toLowerCase().includes(lk)) return mt;
    if(q.options.some(o=>o.text.toLowerCase().includes(lk))) return mt;
    return false;
  });
  Q_RENDERED=0;$('q-main').innerHTML='';renderNextQBatch();
}

function renderNextQBatch(){
  const batch=Q_FILTERED.slice(Q_RENDERED,Q_RENDERED+PAGE);
  const main=$('q-main');
  // 第一次渲染时插入 match 计数
  if(Q_RENDERED===0){
    main.innerHTML='';
    if(!Q_FILTERED.length){
      main.innerHTML=`<div class="empty">
        <div style="font-size:36px;margin-bottom:10px;opacity:.3">🔍</div>
        没找到匹配 <b style="color:var(--accent)">"${escHtml(Q_STATE.kw)}"</b> 的题目<br>
        <span style="font-size:12px">试试搜索"决策树"、"Bedrock"、"RAG"等关键词</span>
      </div>`;
      return;
    }
    const badge=document.createElement('div');
    badge.style.cssText='background:var(--accent-soft);color:var(--accent);padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:10px;display:inline-block';
    badge.textContent=`匹配 ${Q_FILTERED.length} 题`;
    main.appendChild(badge);
  }
  const frag=document.createDocumentFragment();
  batch.forEach(q=>{
    const card=document.createElement('div');
    card.className='q-card';
    // 选项列表（默认不显示对错标记）
    const optsList = q.options.length ? `<div class="opts">${q.options.map(o=>{
      return `<div class="opt" data-key="${o.key}">${o.key}. ${escHtml(o.text)}</div>`;
    }).join('')}</div>` : '';
    // 答案区（默认隐藏，点击展开）
    const answerArea = q.options.length ? `<details class="ans-details"><summary>查看答案与解析</summary>
      <div class="ans-content">
        <div class="ans-key">正确答案：<b>${q.answer.join(', ')}</b></div>
        ${q.options.map(o=>{
          const ok=q.answer.includes(o.key);
          return `<div class="opt ${ok?'correct':''}">${ok?'✓ ':''}${o.key}. ${escHtml(o.text)}</div>`;
        }).join('')}
      </div>
    </details>` : `<div class="ans-key">答案：<b>${q.answer.join(', ')}</b>（热区题）</div>`;

    card.innerHTML=`
      <div class="head">
        <span class="qid">Q${q.id}</span>
        <span class="meta"><span>${escHtml(q.topic)}</span><span class="type">${q.type}</span></span>
      </div>
      <div class="stem">${highlight(q.stem,Q_STATE.kw)}</div>
      ${optsList}
      ${answerArea}
      <div class="kps">${q.kps.map(id=>`<span class="kp" onclick="goToNode('${id}')">${escHtml(kpName(id))}</span>`).join('')}</div>`;
    frag.appendChild(card);
  });
  main.appendChild(frag);
  Q_RENDERED+=batch.length;
  const old=$('q-load-more');if(old)old.remove();
  if(Q_RENDERED<Q_FILTERED.length){
    const div=document.createElement('div');
    div.className='load-more';div.id='q-load-more';
    div.innerHTML=`<button onclick="renderNextQBatch()">加载更多（${Q_RENDERED}/${Q_FILTERED.length}）</button>`;
    main.appendChild(div);
  }
}

/* ================= Tab ================= */
function switchTab(name){
  if(CURRENT_TAB===name)return;
  CURRENT_TAB=name;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id===name+'-view'));
  if(name==='advanced'&&CY)setTimeout(()=>{CY.resize(); renderTierLabels();},50);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

// 高级视图内的子 tab（graph/list）
function switchAdvPane(adv){
  document.querySelectorAll('.adv-tab[data-adv]').forEach(x=>x.classList.toggle('active',x.dataset.adv===adv));
  document.getElementById('adv-graph').style.display = adv==='graph'?'flex':'none';
  document.getElementById('adv-list').style.display = adv==='list'?'flex':'none';
  if(adv==='graph' && CY) setTimeout(()=>{CY.resize(); renderTierLabels();},50);
}
document.querySelectorAll('.adv-tab[data-adv]').forEach(b=>{
  b.onclick = () => {
    const adv = b.dataset.adv;
    switchAdvPane(adv);
  };
});

document.addEventListener('keydown', e=>{
  if(e.target.matches('input, textarea, select')) return;
  if(CURRENT_TAB !== 'advanced') return;
  if(e.key === '/'){
    e.preventDefault();
    switchAdvPane('graph');
    $('search').focus();
  } else if(e.key.toLowerCase() === 'f'){
    CY && CY.fit(null,40);
  } else if(e.key.toLowerCase() === 'r'){
    $('btn-reset').click();
  }
});

// Theme toggle
const THEME_KEY='kg_theme';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('theme-toggle').textContent=t==='dark'?'☀️':'🌙';
  localStorage.setItem(THEME_KEY,t);
  // 重新设置 cytoscape 颜色
  if(CY){
    CY.style().fromJson([
      {selector:'node',style:{
        'color':getComputedStyle(document.body).getPropertyValue('--node-text').trim(),
        'text-outline-color':getComputedStyle(document.body).getPropertyValue('--node-border').trim(),
        'border-color':getComputedStyle(document.body).getPropertyValue('--node-border').trim(),
      }},
      {selector:'edge.highlighted',style:{
        'color':getComputedStyle(document.body).getPropertyValue('--node-text').trim(),
        'text-background-color':getComputedStyle(document.body).getPropertyValue('--panel').trim(),
        'text-border-color':getComputedStyle(document.body).getPropertyValue('--border').trim(),
      }},
    ]).update();
  }
}
$('theme-toggle').onclick=()=>applyTheme(
  document.documentElement.dataset.theme==='dark'?'light':'dark'
);
applyTheme(localStorage.getItem(THEME_KEY)||'light');

// Header stat chips → 跳转到列表并预过滤
document.addEventListener('click',e=>{
  const stat=e.target.closest('.stat[data-cat]');
  if(stat){switchTab('advanced');switchAdvPane('list');setTimeout(()=>{
    const chip=document.querySelector(`.chip[data-cat="${stat.dataset.cat}"]`);
    if(chip)chip.click();
  },50);}
});

loadData();
</script>
<div class="q-modal-mask" id="q-modal-mask" onclick="if(event.target===this)closeQModal()">
  <div class="q-modal" id="q-modal"></div>
</div>
