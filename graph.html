<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 · AWS AIF-C01</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
:root{
  --bg:#f5f7fa;--panel:#ffffff;--panel2:#fafbfc;--border:#e4e8ee;
  --border-strong:#cdd3dc;--text:#1f2937;--muted:#6b7280;
  --accent:#3b82f6;--accent-soft:#dbeafe;--accent2:#8b5cf6;
  --graph-bg-grad-start:#f5f7fa;--graph-bg-grad-end:#e4e8ee;
  --shadow-sm:rgba(15,23,42,.04);--shadow-md:rgba(15,23,42,.08);
  --node-text:#1f2937;--node-border:#ffffff;
}
[data-theme="dark"]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0f172a;--border:#334155;
  --border-strong:#475569;--text:#f1f5f9;--muted:#94a3b8;
  --accent:#60a5fa;--accent-soft:#1e3a8a;--accent2:#a78bfa;
  --graph-bg-grad-start:#0f172a;--graph-bg-grad-end:#070d1a;
  --shadow-sm:rgba(0,0,0,.3);--shadow-md:rgba(0,0,0,.5);
  --node-text:#f1f5f9;--node-border:#0f172a;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;
     transition:background .3s,color .3s}

header{padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);
       display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px var(--shadow-sm)}
.brand{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:6px;
             background:linear-gradient(135deg,#58a6ff,#bc8cff);
             display:grid;place-items:center;font-size:14px;color:#000}
nav{margin-left:auto;display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:8px}
nav a{background:transparent;color:var(--muted);text-decoration:none;
      padding:5px 14px;border-radius:6px;font-size:13px}
nav a.active{background:var(--accent);color:#fff;font-weight:500}
nav a:hover:not(.active){color:var(--text);background:var(--border)}
.theme-toggle{margin-left:8px;background:var(--panel2);border:1px solid var(--border);
              padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text)}

main{height:calc(100vh - 53px);display:flex;position:relative}
#cy{flex:1;background:linear-gradient(135deg,var(--graph-bg-grad-start) 0%,var(--graph-bg-grad-end) 100%);
     cursor:grab}
#cy:active{cursor:grabbing}
#side{width:320px;border-left:1px solid var(--border);background:var(--panel);
      overflow-y:auto;flex-shrink:0;box-shadow:-4px 0 16px var(--shadow-sm)}
.side-empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.side-empty .icon{font-size:42px;margin-bottom:14px;opacity:.4}
.side-content{padding:18px}
.side-content h3{margin:0 0 8px;font-size:17px;font-weight:700;line-height:1.3;color:var(--text)}
.side-content .id{color:var(--muted);font-size:11px;font-weight:500;margin-left:8px;
                  font-family:monospace;background:var(--panel2);padding:1px 6px;border-radius:4px}
.side-content .cat{font-size:11px;margin-bottom:12px;display:inline-block;padding:3px 10px;
                   border-radius:12px;background:var(--accent-soft);color:var(--accent);
                   font-weight:600}
.side-content .def{font-size:13px;line-height:1.7;color:var(--text);margin:14px 0;
                   padding:12px 14px;background:var(--panel2);
                   border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.side-content .triple{padding:8px 12px;background:var(--panel2);border-radius:8px;
                      margin-bottom:6px;font-size:12px;cursor:pointer;
                      border:1px solid var(--border);border-left:3px solid var(--accent2);
                      transition:.15s;line-height:1.5}
.side-content .triple:hover{background:var(--accent-soft);border-color:var(--accent);
                            transform:translateX(2px)}
.side-content .triple .pred{font-weight:700;color:var(--accent2);margin:0 4px;
                            background:rgba(139,92,246,.1);padding:1px 6px;border-radius:3px}
.starter-box{background:var(--accent-soft);border:1px solid rgba(59,130,246,.25);
             border-radius:10px;padding:12px 14px;margin:12px 0;color:var(--text);
             font-size:13px;line-height:1.7}
.q-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
              align-items:center;justify-content:center;z-index:1000;padding:18px}
.q-modal-mask.open{display:flex}
.q-modal{background:var(--panel);border-radius:16px;max-width:640px;width:100%;
         max-height:88vh;overflow-y:auto;box-shadow:0 18px 48px rgba(0,0,0,.25);
         border:1px solid var(--border)}
.q-modal-head{display:flex;justify-content:space-between;align-items:center;
               padding:14px 18px;border-bottom:1px solid var(--border);
               position:sticky;top:0;background:var(--panel);z-index:1}
.q-modal-head .qid{background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px;
                   font-size:12px;font-weight:700;font-family:monospace}
.q-modal-close{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
                width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--muted)}
.q-modal-close:hover{color:var(--text);border-color:var(--accent)}
.q-modal-nav{background:var(--panel2);color:var(--text);border:1px solid var(--border);
             border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.q-modal-nav:hover{border-color:var(--accent);color:var(--accent)}
.q-modal-nav[disabled]{opacity:.4;cursor:not-allowed}
.q-modal-body{padding:16px 18px;display:grid;gap:12px}
.q-modal-body .stem{font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--text)}
.q-modal-body .opts{display:grid;gap:8px}
.q-modal-body .opts .opt{padding:10px 12px;border-radius:8px;background:var(--panel2);
                         border:1px solid var(--border);font-size:13px;line-height:1.55;
                         cursor:pointer;transition:.15s}
.q-modal-body .opts .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.q-modal-body .opts .opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.q-modal-body .opts .opt.correct{background:rgba(16,185,129,.1);border-color:var(--c-eval);
                                  border-left:3px solid var(--c-eval);font-weight:600}
.q-modal-body .opts .opt.wrong{background:rgba(239,68,68,.08);border-color:#ef4444;
                               border-left:3px solid #ef4444}
.q-modal-body .answer-area{display:none;gap:10px}
.q-modal-body.answered .answer-area{display:grid}
.q-modal-body .ans-key{background:rgba(16,185,129,.1);color:var(--c-eval);
                       border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.q-modal-body .explain{font-size:13px;line-height:1.7;color:var(--text);background:var(--panel2);
                       border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0}
.q-modal-body .explain::before{content:'💡 解析：';font-weight:700;color:var(--accent);
                                display:block;margin-bottom:4px;font-size:12px}
.q-modal-body .kps-list{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;
                        border-top:1px dashed var(--border)}
.q-modal-body .kps-list .kp{background:var(--panel2);border:1px solid var(--border);
                           padding:4px 10px;border-radius:8px;font-size:11px;color:var(--muted);
                           cursor:pointer}
.q-modal-body .kps-list .kp:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-modal-body .kps-list .kp.primary{background:var(--accent-soft);color:var(--accent);
                                   border-color:var(--accent)}
.starter-box b{color:var(--accent)}
.section-title{font-size:12px;color:var(--muted);margin:18px 0 8px;font-weight:700;
               display:flex;align-items:center;gap:6px}
.section-title::before{content:'';width:3px;height:12px;background:var(--accent);border-radius:2px}
details.more-rel{margin-top:10px}
details.more-rel summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;
                         background:var(--panel2);border:1px solid var(--border);
                         border-radius:8px;padding:7px 10px;display:inline-block}
.q-related{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q-mini{display:flex;gap:10px;padding:8px 10px;background:var(--panel2);
        border-radius:8px;cursor:pointer;border:1px solid var(--border);
        transition:.15s;font-size:12px;align-items:flex-start;pointer-events:auto}
.q-mini:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(2px)}
.q-mini-id{background:var(--accent);color:#fff;padding:2px 7px;border-radius:4px;
           font-size:10px;font-weight:700;flex-shrink:0;font-family:monospace}
.q-mini-text{flex:1;color:var(--muted);line-height:1.45;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.toolbar{position:absolute;top:14px;left:14px;z-index:10;
         background:var(--panel);padding:8px 12px;border-radius:12px;
         border:1px solid var(--border);box-shadow:0 2px 12px var(--shadow-md);
         display:flex;gap:6px;flex-wrap:wrap;max-width:680px;align-items:center;
         backdrop-filter:blur(12px)}
.toolbar input,.toolbar select{background:var(--panel2);color:var(--text);
        border:1px solid var(--border);padding:6px 11px;border-radius:8px;
        font-size:12px;outline:none;transition:.15s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar input{width:180px}
.toolbar .sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.toolbar button{background:var(--accent);color:#fff;border:none;padding:6px 12px;
                border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;
                transition:.15s}
.toolbar button:hover{transform:translateY(-1px);box-shadow:0 2px 6px var(--shadow-md)}
.toolbar button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.toolbar .count{color:var(--muted);font-size:11px;padding:0 6px;font-weight:500;
               max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.legend{position:absolute;bottom:14px;left:14px;background:var(--panel);
        padding:10px 14px;border-radius:12px;border:1px solid var(--border);
        box-shadow:0 2px 12px var(--shadow-md);font-size:11px;max-width:260px}
.legend .title{font-weight:600;margin-bottom:6px;font-size:10px;color:var(--muted);
               text-transform:uppercase;letter-spacing:.8px}
.legend .item{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px}
.legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;
             box-shadow:0 0 0 2px var(--panel)}

.tier-band,.tier-label{display:none}  /* 旧分层带已废弃 */

.loading{padding:60px 20px;text-align:center;color:var(--muted);width:100%}
.loading .spin{font-size:36px;margin-bottom:16px;animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🎓</span>AWS AIF-C01 学习助手</div>
  <nav>
    <a href="learn.html">学习</a>
    <a href="quiz.html">刷题</a>
    <a href="graph.html" class="active">高级</a>
  </nav>
  <button class="theme-toggle" id="theme-toggle">🌙</button>
</header>
<main id="main">
  <div class="loading"><div class="spin">⏳</div><div>加载知识图谱...</div></div>
</main>

<style>
/* 空状态 */
.empty-state{position:absolute;inset:0;display:grid;place-items:center;
              background:var(--graph-bg-grad-start);z-index:5;padding:20px}
.empty-state .panel{max-width:680px;width:100%;text-align:center}
.empty-state h2{font-size:24px;margin:0 0 8px;color:var(--text)}
.empty-state .lead{color:var(--muted);margin-bottom:24px;font-size:14px;line-height:1.7}
.empty-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.empty-action{background:var(--panel);border:1px solid var(--border);border-radius:12px;
              padding:18px 14px;cursor:pointer;text-align:left;transition:.15s;
              box-shadow:0 1px 3px var(--shadow-sm)}
.empty-action:hover{border-color:var(--accent);transform:translateY(-2px);
                    box-shadow:0 6px 16px var(--shadow-md)}
.empty-action .icon{font-size:24px;margin-bottom:8px;display:block}
.empty-action h3{margin:0 0 4px;font-size:14px;color:var(--text);font-weight:700}
.empty-action p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.empty-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 已加载节点数显示 */
.node-count{position:absolute;bottom:14px;right:340px;background:var(--panel);
            padding:6px 12px;border-radius:10px;border:1px solid var(--border);
            font-size:11px;color:var(--muted);box-shadow:0 2px 8px var(--shadow-sm);
            z-index:10;font-weight:500}
.node-count b{color:var(--accent)}
.graph-help{position:absolute;right:340px;top:14px;z-index:10;background:var(--panel);
            border:1px solid var(--border);border-radius:12px;padding:9px 12px;
            box-shadow:0 2px 12px var(--shadow-md);color:var(--muted);
            font-size:11px;line-height:1.7;max-width:245px}
.graph-help b{color:var(--text)}
.side-actions{display:flex;gap:8px;margin:12px 0 14px}
.side-actions button{flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;
                     padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.side-actions button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.side-actions button:hover{transform:translateY(-1px);box-shadow:0 3px 8px var(--shadow-md)}
@media (max-width: 820px){
  body{overflow:auto}
  header{position:sticky;top:0;z-index:20;flex-wrap:wrap}
  main{height:auto;min-height:calc(100vh - 53px);flex-direction:column}
  #cy{min-height:58vh;flex:0 0 58vh}
  #side{width:100%;max-height:42vh;border-left:none;border-top:1px solid var(--border)}
  .toolbar{position:static;margin:10px;max-width:none;order:-1}
  .node-count{right:14px;bottom:calc(42vh + 14px)}
  .legend,.graph-help{display:none!important}
  .empty-actions{grid-template-columns:1fr}
}
</style>

<script>
const COLORS={
  'AI/ML基础':'#3b82f6','评估指标':'#10b981','生成式AI':'#f59e0b','AI应用':'#f97316',
  '提示工程':'#a855f7','RAG与微调':'#ef4444','Bedrock':'#06b6d4','SageMaker':'#22c55e',
  'Amazon Q':'#0ea5e9','安全合规':'#f43f5e','负责任的AI':'#c084fc'
};
const PRED_COLORS={
  '属于':'#3b82f6','包含':'#10b981','用于':'#f59e0b','依赖':'#ef4444',
  '影响':'#f97316','解决':'#059669','对比':'#8b5cf6','缓解':'#0d9488',
  '前置':'#2563eb','工具':'#b45309','成因':'#dc2626','检测工具':'#0284c7',
  '实现方法':'#7c3aed','提升方法':'#15803d','适用':'#c2410c','限制':'#64748b',
  '后果':'#b91c1c','前提':'#1d4ed8','典型例子':'#ea580c','实现手段':'#047857',
  '范围':'#6d28d9','单位':'#5b21b6'
};

const $ = id => document.getElementById(id);
const escHtml = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let DATA = null, CY = null;
let VIEW_MODE = 'hierarchy';
let MODAL_Q_LIST = [];
let MODAL_Q_INDEX = -1;

async function load(){
  try{
    const r = await fetch('graph.json?t='+Date.now());
    DATA = await r.json();
    computeDegree();
    // graph.json 不含 questions，并行加载 quiz.json 以便节点详情显示主考题。
    try{
      const qr = await fetch('quiz.json?t='+Date.now());
      const qd = await qr.json();
      DATA.questions = qd.questions || [];
      DATA.kpsById = Object.fromEntries(DATA.kps.map(k=>[k.id,k]));
    }catch(_){ DATA.questions = []; }
  }catch(e){
    $('main').innerHTML = '<div class="loading">❌ 加载失败：'+e.message+'</div>';
    return;
  }

  $('main').innerHTML = `
    <div id="cy"></div>
    <div class="empty-state" id="empty-state">
      <div class="panel">
        <h2>先别看完整大图</h2>
        <p class="lead">对新手来说，知识图谱最有用的是“围绕一个知识点看它怎么考”。建议从题目里的知识点进入，或先加载少量核心概念。</p>
        <div class="empty-actions">
          <div class="empty-action" onclick="loadHub()">
            <span class="icon">🎯</span>
            <h3>核心枢纽</h3>
            <p>只加载 8 个考试高频概念，先建立方向感</p>
          </div>
          <div class="empty-action" onclick="showCatPicker()">
            <span class="icon">📂</span>
            <h3>按主题浏览</h3>
            <p>每个主题只加载最核心的 6 个概念，不再铺满整张图</p>
          </div>
        </div>
        <div class="empty-tip">
          建议用法：点击节点 → 看右侧“新手先看” → 再决定要不要展开邻居
        </div>
      </div>
    </div>
    <div class="toolbar" style="display:none" id="toolbar">
      <button id="btn-back" title="清空图谱，返回选择加载方式"
              style="font-weight:700;font-size:13px;padding:7px 14px;
                     background:var(--accent);color:#fff;border:none;
                     border-radius:8px;cursor:pointer;
                     box-shadow:0 2px 8px rgba(59,130,246,.4)">
        ← 返回选主题
      </button>
      <span class="sep"></span>
      <select id="view-mode" title="切换图谱关系数量：先看结构，再看应用，最后查完整细节">
        <option value="hierarchy">📚 层级结构</option>
        <option value="functional">🔧 应用关系</option>
        <option value="all">🔗 完整关系</option>
      </select>
      <span class="sep"></span>
      <button class="ghost" id="btn-fit">居中</button>
    </div>
    <div class="node-count" id="node-count" style="display:none"></div>
    <div class="graph-help" id="graph-help" style="display:none">
      <b>操作</b>：点击查看详情，双击展开一层邻居；“层级结构/应用关系/完整关系”控制画面复杂度。
    </div>
    <div class="legend" id="legend" style="display:none"></div>
    <aside id="side"><div class="side-empty"><div class="icon">🕸️</div>点击节点查看详情<br>双击展开邻居</div></aside>
    <div class="q-modal-mask" id="q-modal-mask" onclick="if(event.target===this)closeQModal()">
      <div class="q-modal" id="q-modal"></div>
    </div>
  `;

  initGraph();
  initEvents();
  initFocusFromUrl();
}

// 全局：已加载的节点 ID 集合
let LOADED = new Set();

function hideEmpty(){
  $('empty-state').style.display = 'none';
  $('toolbar').style.display = 'flex';
  $('node-count').style.display = 'block';
  $('graph-help').style.display = 'block';
  $('legend').style.display = 'block';
  initLegend();
  updateCount();
}

// 「当前选中节点」侧栏的返回按钮
function showSideBack(){
  const old = $('side').querySelector('.side-back-btn');
  if(old) return;
  const btn = document.createElement('button');
  btn.className = 'side-back-btn';
  btn.style.cssText = 'width:100%;padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;font-weight:500;margin-bottom:10px';
  btn.innerHTML = '← 清空图谱，返回选主题';
  btn.onclick = showEmpty;
  $('side').prepend(btn);
}

function showEmpty(){
  $('empty-state').style.display = 'grid';
  $('toolbar').style.display = 'none';
  $('node-count').style.display = 'none';
  $('graph-help').style.display = 'none';
  $('legend').style.display = 'none';
  CY.elements().remove();
  LOADED = new Set();
  $('side').innerHTML = '<div class="side-empty"><div class="icon">🕸️</div>点击节点查看详情<br>双击展开邻居</div>';
}

function updateCount(){
  const n = CY.nodes().length, e = CY.edges().length;
  $('node-count').innerHTML = `<b>${n}</b> 节点 · <b>${e}</b> 关系`;
}

function loadHub(){
  hideEmpty();
  const hubIds = ['KP037','KP038','KP099','KP085','KP092','KP071','KP111','KP149'];
  // 先全部加入
  hubIds.forEach(id => addNode(id));
  // 再补全它们之间的边
  hubIds.forEach(id => addEdgesForNode(id));
  layoutLoaded();

window.loadCategory = function(cat){
  hideEmpty();
  const catKps = DATA.kps.filter(k => k.category === cat)
    .sort((a,b)=>(DEGREE[b.id]||0)-(DEGREE[a.id]||0))
    .slice(0, 6);
  // 新手模式：只加载主题内最核心节点，避免整页信息过载。
  catKps.forEach(k => addNode(k.id));
  // 加载与之关联的跨主题节点（按度数取最重要的，最多 10 个）
  const idsSet = new Set(catKps.map(k=>k.id));
  const neighborIds = new Set();
  DATA.triples.forEach(t => {
    const s = nameToId(t.subject), o = nameToId(t.object);
    if(s && idsSet.has(s) && o && !idsSet.has(o)) neighborIds.add(o);
    if(o && idsSet.has(o) && s && !idsSet.has(s)) neighborIds.add(s);
  });
  const extraIds = [...neighborIds]
    .sort((a,b)=>(DEGREE[b]||0)-(DEGREE[a]||0))
    .slice(0, 6);
  extraIds.forEach(id => addNode(id));
  layoutLoaded();
  applyViewMode(VIEW_MODE);
  const total = catKps.length + extraIds.length;
  $('side').innerHTML = `<div class="side-empty">
    <div class="icon">💡</div>
    已加载「${escHtml(cat)}」最核心的 <b style="color:var(--accent)">${catKps.length}</b> 个节点
    ${extraIds.length? `<br>+ <b>${extraIds.length}</b> 个跨主题关联节点` : ''}
    <br><span style="color:var(--muted);font-size:11px">共 ${total} 个节点 · 点击查看 · 双击展开更多</span>
  </div>`;
};

// 全局度数（所有 KP 的），用于节点大小和主题核心排序。
let DEGREE = {};
function computeDegree(){
  DEGREE = {};
  DATA.kps.forEach(k => DEGREE[k.id]=0);
  DATA.triples.forEach(t => {
    const s = nameToId(t.subject), o = nameToId(t.object);
    if(s) DEGREE[s] = (DEGREE[s]||0)+1;
    if(o) DEGREE[o] = (DEGREE[o]||0)+1;
  });
}

// 添加单个节点（如未加载），并自动连接已加载的节点
function addNode(id){
  if(LOADED.has(id)) return;
  const kp = DATA.kps.find(k=>k.id===id);
  if(!kp) return;
  LOADED.add(id);
  CY.add({group:'nodes', data:{id:kp.id,name:kp.name,category:kp.category,definition:kp.definition,aliases:kp.aliases}});
  // 自动添加与已加载节点的边
  addEdgesForNode(id);
}

// 给指定节点添加所有相关边（与已加载节点的）
function addEdgesForNode(id){
  DATA.triples.forEach((t, i) => {
    const s = nameToId(t.subject), o = nameToId(t.object);
    if(!s || !o) return;
    let other = null;
    if(s === id && LOADED.has(o)) other = o;
    else if(o === id && LOADED.has(s)) other = s;
    if(other === null) return;
    const edgeId = `e-${s}-${o}-${t.predicate}`;
    if(CY.getElementById(edgeId).length === 0){
      CY.add({group:'edges', data:{id:edgeId, source:s, target:o, predicate:t.predicate, type:t.type}});
    }
  });
}

// 添加节点和它的 N 层邻居
function addNodeWithNeighbors(id, depth){
  if(depth===undefined) depth = 1;
  const visited = new Set();
  const queue = [{id, d:0}];
  while(queue.length){
    const {id:cur, d} = queue.shift();
    if(visited.has(cur)) continue;
    visited.add(cur);
    addNode(cur);
    if(d >= depth) continue;
    DATA.triples.forEach(t => {
      const s = nameToId(t.subject), o = nameToId(t.object);
      if(s === cur && o && !LOADED.has(o)) queue.push({id:o, d:d+1});
      else if(o === cur && s && !LOADED.has(s)) queue.push({id:s, d:d+1});
    });
  }
  // 添加所有相关边
  visited.forEach(id => {
    DATA.triples.forEach((t,i) => {
      const s = nameToId(t.subject), o = nameToId(t.object);
      if((s===id||o===id) && visited.has(s) && visited.has(o)){
        const edgeId = 'e-'+s+'-'+o+'-'+t.predicate;
        if(CY.getElementById(edgeId).length === 0){
          CY.add({group:'edges', data:{id:edgeId, source:s, target:o, predicate:t.predicate, type:t.type}});
        }
      }
    });
  });
}

// 为已加载节点布局（环形布局）
function layoutLoaded(){
  if(!CY || CY.nodes().length===0) return;
  const nodes = CY.nodes();
  const center = {x:0, y:0};
  const N = nodes.length;
  if(N === 1){
    nodes[0].position(center);
  } else if(N <= 6){
    // 小网格
    const cols = Math.ceil(Math.sqrt(N));
    const SP = 100;
    nodes.forEach((n,i)=>{
      const c = i % cols, r = Math.floor(i/cols);
      n.position({x:(c-(cols-1)/2)*SP, y:(r-(Math.ceil(N/cols)-1)/2)*SP});
    });
  } else {
    // 环形布局：核心节点居中，其他环绕
    const sorted = nodes.sort((a,b)=>(DEGREE[b.id()]||0)-(DEGREE[a.id()]||0));
    const hub = sorted[0];
    hub.position(center);
    const others = sorted.slice(1);
    const R = Math.max(180, others.length * 22);
    others.forEach((n, i) => {
      const angle = (i / others.length) * 2 * Math.PI;
      n.position({x: Math.cos(angle)*R, y: Math.sin(angle)*R});
    });
  }
  CY.fit(null, 60);
  updateCount();
}

function nameToId(name){
  const k = DATA.kps.find(x=>x.name===name);
  return k ? k.id : null;
}

function kpName(id){
  const k = DATA.kps.find(x=>x.id===id);
  return k ? k.name : id;
}

const VIEW_MODES = {
  hierarchy: ['属于','包含'],
  functional: ['属于','包含','用于','解决','缓解','依赖','前置','提升'],
  all: null
};

function applyViewMode(mode){
  VIEW_MODE = mode;
  const preds = VIEW_MODES[mode];
  CY.batch(()=>{
    if(preds===null){
      CY.edges().removeClass('dim');
    } else {
      CY.edges().forEach(e=>{
        if(preds.includes(e.data('predicate'))) e.removeClass('dim');
        else e.addClass('dim');
      });
    }
  });
  const hints = {
    hierarchy: '📚 层级结构：先建立知识框架',
    functional: '🔧 应用关系：看考试场景',
    all: '🔗 完整关系：查全部细节'
  };
  // 显示提示在节点计数区（如果存在）
  const nc = $('node-count');
  if(nc){
    const oldHint = nc.querySelector('.view-hint');
    if(oldHint) oldHint.remove();
    if(mode !== 'hierarchy'){
      const hint = document.createElement('div');
      hint.className = 'view-hint';
      hint.style.cssText = 'margin-top:6px;color:var(--muted);font-size:11px';
      hint.innerHTML = hints[mode] || '';
      nc.appendChild(hint);
    }
  }
}

function initEvents(){
  CY.on('tap','node',e=>showNode(e.target));
  CY.on('dbltap','node',e=>{
    addNodeWithNeighbors(e.target.id(), 1);
    layoutLoaded();
  });
  CY.on('mouseover','edge',e=>e.target.addClass('highlighted'));
  CY.on('mouseout','edge',e=>e.target.removeClass('highlighted'));

  $('view-mode').onchange = e => applyViewMode(e.target.value);
  applyViewMode('hierarchy');

  $('btn-fit').onclick = ()=>{ CY.fit(null,60); };
  $('btn-back').onclick = showEmpty;
}


function debounce(fn, ms){
  let t;
  return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
}

function showNode(node){
  const k = node.data();
  CY.batch(()=>{
    CY.elements().removeClass('faded highlighted');
    const nb = node.closedNeighborhood();
    CY.nodes().difference(nb.nodes()).addClass('faded');
    CY.edges().difference(nb.edges()).addClass('faded');
    nb.nodes().addClass('highlighted');
    nb.edges().not('.dim').addClass('highlighted');
    node.removeClass('faded').addClass('highlighted');
  });

  const incoming = DATA.triples.filter(t=>nameToId(t.object)===k.id);
  const outgoing = DATA.triples.filter(t=>nameToId(t.subject)===k.id);
  const all = [...incoming,...outgoing];
  let relatedQs = (DATA.questions || []).filter(q => q.kps && q.kps[0] === k.id);
  if(!relatedQs.length){
    relatedQs = (DATA.questions || [])
      .filter(q => q.kps && q.kps.includes(k.id))
      .map(q => ({q, pos: q.kps.indexOf(k.id)}))
      .sort((a,b)=>a.pos-b.pos || a.q.id-b.q.id)
      .slice(0, 8)
      .map(x=>x.q);
  }
  if(!relatedQs.length){
    const kw = (k.name + ' ' + (k.aliases||[]).join(' ')).toLowerCase();
    relatedQs = (DATA.questions || [])
      .filter(q => q.topic === k.category
        || (kw && (q.stem.toLowerCase().includes(kw) || q.options.some(o=>o.text.toLowerCase().includes(kw)))))
      .map(q => ({q, score: (q.topic===k.category?100:0) + (q.stem.toLowerCase().includes(k.name.toLowerCase())?20:0) + (q.options.some(o=>o.text.toLowerCase().includes(k.name.toLowerCase()))?10:0)}))
      .sort((a,b)=>b.score-a.score || a.q.id-b.q.id)
      .slice(0, 6)
      .map(x=>x.q);
  }
  const keyPreds = new Set(['属于','包含','用于','解决','依赖','前置','缓解','对比','限制','影响']);
  const keyRelations = all.filter(t=>keyPreds.has(t.predicate)).slice(0, 6);
  const otherRelations = all.filter(t=>!keyRelations.includes(t));

  $('side').innerHTML = `
    <div class="side-content">
      <h3>${k.name}<span class="id">${k.id}</span></h3>
      <span class="cat" style="color:${COLORS[k.category]}">${k.category}</span>
      <div class="def">${k.definition}</div>
      <div class="starter-box">
        <b>新手先看：</b><br>
        1. 先记住上面的定义。<br>
        2. 再看下面 ${relatedQs.length ? relatedQs.length + ' 道主考题' : '是否有主考题'}。<br>
        3. 最后只看“关键关系”，不用一开始研究整张网。
      </div>
      <div class="side-actions">
        <button onclick="expandNode('${k.id}')">展开邻居</button>
        <button class="ghost" onclick="focusNode('${k.id}')">重新聚焦</button>
      </div>
      <div class="section-title">关键关系 (${keyRelations.length})</div>
      ${keyRelations.map(t=>{
        const otherName = t.subject===k.name ? t.object : t.subject;
        const otherId = nameToId(otherName);
        const isSubj = t.subject===k.name;
        return `<div class="triple" onclick="focusNode('${otherId}')">
          <span style="font-weight:500">${isSubj?k.name:otherName}</span>
          <span style="color:var(--muted)">${isSubj?'→':'←'}</span>
          <span class="pred">${t.predicate}</span>
          <span style="color:var(--muted)">${isSubj?'→':'←'}</span>
          <span style="font-weight:500">${isSubj?otherName:k.name}</span>
        </div>`;
      }).join('') || '<div style="color:var(--muted);font-size:12px">暂无关键关系</div>'}
      ${otherRelations.length ? `<details class="more-rel"><summary>查看全部关系（${all.length} 条）</summary>
        ${all.map(t=>{
          const otherName = t.subject===k.name ? t.object : t.subject;
          const otherId = nameToId(otherName);
          const isSubj = t.subject===k.name;
          return `<div class="triple" onclick="focusNode('${otherId}')">
            <span style="font-weight:500">${isSubj?k.name:otherName}</span>
            <span style="color:var(--muted)">${isSubj?'→':'←'}</span>
            <span class="pred">${t.predicate}</span>
            <span style="color:var(--muted)">${isSubj?'→':'←'}</span>
            <span style="font-weight:500">${isSubj?otherName:k.name}</span>
          </div>`;
        }).join('')}
      </details>` : ''}
      <div class="section-title">主考题目 (${relatedQs.length})</div>
      <div class="q-related" id="q-related">
        ${relatedQs.length===0 ? '<div style="color:var(--muted);font-size:12px;padding:6px 0">这道概念在题库里没有单独出题。<br>试试看它的父类或强关联知识点。</div>' :
          relatedQs.map(q=>`
            <div class="q-mini" data-qid="${q.id}" title="点击查看完整题目">
              <span class="q-mini-id">Q${q.id}</span>
              <span class="q-mini-text">${escHtml(q.stem_short || q.stem || '')}</span>
            </div>`).join('')}
      </div>
    </div>`;
  showSideBack();
  bindQRelated();
}

  modal.onclick = e=>{
    const closeBtn = e.target.closest('[data-close]');
    if(closeBtn){ closeQModal(); return; }
    if(e.target.closest('[data-prev]')){ openAdjacentQ(-1); return; }
    if(e.target.closest('[data-next]')){ openAdjacentQ(1); return; }
    if(e.target.closest('[data-show-answer]')){ revealModalAnswer(q); return; }
    const kp = e.target.closest('[data-kp]');
    if(kp){ closeQModal(); loadFocusNode(kp.dataset.kp); }
    const opt = e.target.closest('[data-opt]');
    if(opt){
      modal.querySelectorAll('[data-opt]').forEach(o=>o.classList.remove('selected','correct','wrong'));
      opt.classList.add('selected');
      revealModalAnswer(q, opt.dataset.opt);
    }
  };
  mask.classList.add('open');
}

function openAdjacentQ(delta){
  const nextIndex = MODAL_Q_INDEX + delta;
  if(nextIndex < 0 || nextIndex >= MODAL_Q_LIST.length) return;
  MODAL_Q_INDEX = nextIndex;
  openQModal(MODAL_Q_LIST[MODAL_Q_INDEX]);
}

function revealModalAnswer(q, selectedKey){
  const modal = $('q-modal');
  if(!modal) return;
  modal.querySelector('.q-modal-body')?.classList.add('answered');
  const answers = q.answer || [];
  modal.querySelectorAll('[data-opt]').forEach(opt=>{
    const key = opt.dataset.opt;
    opt.classList.toggle('correct', answers.includes(key));
    opt.classList.toggle('wrong', selectedKey===key && !answers.includes(key));
  });
}

function closeQModal(){
  const mask = $('q-modal-mask');
  if(mask) mask.classList.remove('open');
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeQModal();
});

function focusNeighborhood(node){
  CY.batch(()=>{
    CY.elements().removeClass('faded highlighted');
    const nb = node.closedNeighborhood();
    CY.nodes().difference(nb.nodes()).addClass('faded');
    CY.edges().difference(nb.edges()).addClass('faded');
  });
}

function initLegend(){
  const cats = {};
  DATA.kps.forEach(k=>cats[k.category]=(cats[k.category]||0)+1);
  $('legend').innerHTML =
    `<div class="title">分类</div>`+
    Object.entries(cats).sort((a,b)=>b[1]-a[1])
      .map(([c,n])=>`<div class="item"><span class="dot" style="background:${COLORS[c]}"></span>${c} <span style="color:var(--muted);margin-left:auto">${n}</span></div>`).join('') +
    `<div class="title" style="margin-top:8px">边类型</div>
    <div class="item"><span style="display:inline-block;width:18px;height:0;border-top:2px solid #3b82f6"></span>层级（属于/包含）</div>
    <div class="item"><span style="display:inline-block;width:18px;height:0;border-top:1.5px solid #f59e0b"></span>功能（用于/解决）</div>`;
}

window.focusNode = focusNode;
window.expandNode = expandNode;

// 主题
const THEME_KEY='kg_theme';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $('theme-toggle').textContent = t==='dark'?'☀️':'🌙';
  localStorage.setItem(THEME_KEY,t);
  if(CY) CY.fit(null,60);
}
$('theme-toggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
applyTheme(localStorage.getItem(THEME_KEY)||'light');

load();
</script>
</body>
